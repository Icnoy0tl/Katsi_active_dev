<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HailMary · Earth analogs for Moon and Mars base sites</title>
  <meta name="description" content="Explore Earth, the Moon and Mars in 3D and find the places on Earth that most resemble the proposed sites for permanent bases on the Moon and Mars." />
  <meta name="theme-color" content="#05070c" />
  <meta name="color-scheme" content="dark" />

  <!-- Íconos -->
  <link rel="icon" href="./frontend/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./frontend/icons/apple-touch-icon.png" />

  <!-- Vista previa al compartir (Open Graph / Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HailMary" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="HailMary · Earth analogs for Moon and Mars base sites" />
  <meta property="og:description" content="Explore Earth, the Moon and Mars in 3D and find the places on Earth that most resemble the proposed sites for permanent bases." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HailMary · Earth analogs for Moon and Mars base sites" />
  <meta name="twitter:description" content="Explore Earth, the Moon and Mars in 3D and find the places on Earth that most resemble the proposed sites for permanent bases." />
  <!-- Pendiente hasta tener dominio (deben ser URLs absolutas):
  <link rel="canonical" href="https://DOMINIO/" />
  <meta property="og:url" content="https://DOMINIO/" />
  <meta property="og:image" content="https://DOMINIO/frontend/icons/og-image.jpg" />
  <meta name="twitter:image" content="https://DOMINIO/frontend/icons/og-image.jpg" />
  -->
  <!-- Tailwind CSS para la interfaz flotante -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070c;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* ---------- Menú principal ---------- */
    .is-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    /* Oculto por la vista de misión (independiente de .is-hidden, que gestiona el menú) */
    .is-replaced {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #main-menu {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 clamp(16px, 6vw, 96px);
      /* Oscurece solo el lado izquierdo para que el texto se lea sobre la escena */
      background: linear-gradient(90deg, rgba(3, 5, 10, 0.72) 0%, rgba(3, 5, 10, 0.35) 38%, rgba(3, 5, 10, 0) 60%);
      transition: opacity 0.6s ease;
    }

    .menu-title {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(2.6rem, 6.4vw, 5.4rem);
      letter-spacing: 0.01em;
      line-height: 1.05;
      margin: 0;
      color: #eef2f8;
      /* Destello: degradado recortado al texto que se desplaza (ver menu-shine) */
      background: linear-gradient(110deg, #eef2f8 0%, #eef2f8 42%, #ffffff 48%, #9fd0ff 50%, #ffffff 52%, #eef2f8 58%, #eef2f8 100%) 100% 0 / 300% 100% no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      /* text-shadow se pintaría a través del relleno transparente: usamos drop-shadow */
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.12)) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }

    .menu-description {
      max-width: min(42rem, 100%);
      margin: 1.4rem 0 0;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.78rem, 1.15vw, 0.95rem);
      letter-spacing: 0.2em;
      line-height: 1.75;
      text-transform: uppercase;
      color: rgba(203, 213, 225, 0.72);
      background: linear-gradient(110deg, rgba(203, 213, 225, 0.72) 0%, rgba(203, 213, 225, 0.72) 42%, rgba(255, 255, 255, 0.95) 50%, rgba(203, 213, 225, 0.72) 58%, rgba(203, 213, 225, 0.72) 100%) 100% 0 / 300% 100% no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }

    /* Línea de acento: tramo azul que continúa en una línea tenue que se desvanece */
    .menu-accent {
      width: min(15rem, 60vw);
      height: 3px;
      margin: 1.6rem 0 clamp(2rem, 6vh, 3.5rem);
      border-radius: 2px;
      background:
        linear-gradient(90deg, #3b82f6 0, #60a5fa 25%, transparent 25%),
        linear-gradient(90deg, rgba(148, 163, 184, 0.28) 25%, rgba(148, 163, 184, 0) 100%);
      box-shadow: -10px 0 14px -6px rgba(59, 130, 246, 0.7);
    }

    .menu-options {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    /* Opción: icono | divisor | etiqueta → flecha. El marco luminoso se dibuja con ::before/::after */
    .menu-tag {
      --chamfer: 16px;
      --frame: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% 36%, 100% 64%, calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 64%, 0 36%);
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      width: min(28rem, calc(100vw - 32px));
      height: clamp(3.6rem, 8vh, 4.4rem);
      will-change: width;
      padding: 0 1.6rem 0 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: clamp(0.85rem, 1.3vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(203, 213, 225, 0.65);
      transition: color 0.3s ease, filter 0.3s ease, width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Borde (degradado azul) y relleno del marco: ocultos hasta que la opción se resalta */
    .menu-tag::before,
    .menu-tag::after {
      content: '';
      position: absolute;
      z-index: -1;
      clip-path: var(--frame);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .menu-tag::before {
      inset: 0;
      background: linear-gradient(90deg, #3b82f6 0%, #93c5fd 45%, #60a5fa 75%, #2563eb 100%);
    }
    .menu-tag::after {
      inset: 1.5px;
      background:
        radial-gradient(120% 140% at 100% 100%, rgba(59, 130, 246, 0.22) 0%, transparent 45%),
        linear-gradient(180deg, rgba(14, 24, 48, 0.92) 0%, rgba(6, 11, 26, 0.92) 100%);
    }

    .menu-icon-box {
      width: 4.6rem;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-icon {
      width: 1.5rem;
      height: 1.5rem;
      color: rgba(203, 213, 225, 0.6);
      transition: color 0.3s ease;
    }

    .menu-divider {
      width: 1px;
      height: 45%;
      background: rgba(203, 213, 225, 0.25);
      flex-shrink: 0;
    }

    .menu-label {
      flex: 1;
      padding-left: 1.6rem;
    }

    .menu-arrow {
      width: 1.4rem;
      height: 1.4rem;
      flex-shrink: 0;
      color: rgba(148, 163, 184, 0.7);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Opción resaltada al pasar el mouse (o con foco de teclado) */
    .menu-tag:hover,
    .menu-tag:focus-visible {
      outline: none;
      color: #f1f5f9;
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.55));
    }
    .menu-tag:hover::before,
    .menu-tag:hover::after,
    .menu-tag:focus-visible::before,
    .menu-tag:focus-visible::after {
      opacity: 1;
    }
    .menu-tag:hover .menu-icon,
    .menu-tag:focus-visible .menu-icon {
      color: #60a5fa;
    }
    .menu-tag:hover .menu-arrow,
    .menu-tag:focus-visible .menu-arrow {
      opacity: 1;
    }
    .menu-tag:hover .menu-arrow {
      transform: translateX(4px);
    }

    /* Al pasar el mouse la tarjeta se alarga hacia la derecha */
    .menu-tag:hover,
    .menu-tag:focus-visible {
      width: min(32rem, calc(100vw - 32px));
    }

    /* Entrada escalonada al abrir el menú (se repite cada vez que vuelve a mostrarse) */
    @keyframes menu-enter {
      from {
        opacity: 0;
        transform: translateX(-28px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes menu-accent-grow {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    #main-menu:not(.is-hidden) .menu-enter {
      animation: menu-enter 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(0.15s + var(--i, 0) * 0.1s);
    }

    /* Destello que barre el título y la descripción de izquierda a derecha, con pausa entre pasadas */
    @keyframes menu-shine {
      0% {
        background-position: 100% 0;
      }
      45%,
      100% {
        background-position: 0% 0;
      }
    }

    #main-menu:not(.is-hidden) .menu-title,
    #main-menu:not(.is-hidden) .menu-description {
      animation:
        menu-enter 0.7s cubic-bezier(0.22, 1, 0.36, 1) calc(0.15s + var(--i, 0) * 0.1s) both,
        menu-shine 4.5s ease-in-out calc(1s + var(--i, 0) * 0.35s) infinite;
    }

    #main-menu:not(.is-hidden) .menu-accent {
      transform-origin: left center;
      animation: menu-accent-grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.4s;
    }

    @media (prefers-reduced-motion: reduce) {
      #main-menu:not(.is-hidden) .menu-enter,
      #main-menu:not(.is-hidden) .menu-accent {
        animation: none;
      }
      .menu-tag {
        transition: none;
      }
    }

    /* Etiqueta de los puntos de terreno */
    .terrain-tooltip {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 6px;
      background: rgba(6, 11, 26, 0.88);
      font-size: 0.75rem;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }
    .terrain-tooltip strong {
      font-weight: 600;
      color: #f1f5f9;
    }
    .terrain-tooltip span {
      color: rgba(148, 163, 184, 0.9);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Viñeta de la vista de misión ----------
       Oscurece los bordes (sobre todo arriba y a los lados, donde están los botones) y deja
       el centro despejado para el área. Solo opacidad: el navegador la compone sin repintar. */
    #mission-vignette {
      position: fixed;
      inset: 0;
      z-index: 10; /* sobre la escena (1), bajo los paneles (20) y botones (30) */
      pointer-events: none;
      background:
        radial-gradient(ellipse 75% 70% at 50% 55%, rgba(3, 5, 10, 0) 45%, rgba(3, 5, 10, 0.55) 80%, rgba(3, 5, 10, 0.85) 100%),
        linear-gradient(180deg, rgba(3, 5, 10, 0.55) 0%, rgba(3, 5, 10, 0) 18%, rgba(3, 5, 10, 0) 82%, rgba(3, 5, 10, 0.45) 100%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #mission-vignette.is-visible {
      opacity: 1;
    }

    /* Paneles con scroll sin barra: un difuminado inferior indica que hay más contenido debajo */
    .scroll-fade {
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 6rem), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 6rem), transparent);
    }
    .scroll-fade::-webkit-scrollbar {
      display: none;
    }
    .scroll-fade.is-scroll-end {
      -webkit-mask-image: none;
      mask-image: none;
    }

    /* ---------- Vista API: panel derecho para soltar los JSON ---------- */
    #api-panel {
      transform: translateY(-50%);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #api-panel.is-hidden {
      transform: translate(12px, -50%);
    }
    #api-panel:not(.is-hidden) .menu-enter {
      animation: menu-enter 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(0.05s + var(--i, 0) * 0.08s);
    }
    #api-panel:not(.is-hidden) .missions-accent {
      animation: menu-accent-grow 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }
    .api-slot {
      position: relative;
    }
    /* Ranura vacía: marco tenue visible siempre, para que se lea como zona de soltar */
    .api-drop {
      min-height: 5.6rem;
    }
    .api-drop::before {
      opacity: 0.22;
    }
    .api-drop::after {
      opacity: 0.7;
    }
    .api-drop .menu-arrow {
      opacity: 0.6;
    }
    .api-drop.is-loaded {
      color: #e2e8f0;
    }
    .api-drop.is-loaded::before {
      opacity: 0.6;
    }
    .api-drop.is-loaded .menu-icon {
      color: #60a5fa;
    }
    /* Arrastrando sobre el panel: todas las ranuras se avivan y la de debajo se resalta */
    #api-panel.is-dragging .api-drop::before {
      opacity: 0.6;
    }
    #api-panel .api-drop.is-drag-over {
      color: #f1f5f9;
      filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.65));
      transform: translateX(-6px);
    }
    #api-panel .api-drop.is-drag-over::before,
    #api-panel .api-drop.is-drag-over::after {
      opacity: 1;
    }
    /* El panel está a la derecha: la tarjeta se desplaza hacia dentro (izquierda) */
    #api-panel .api-drop:hover,
    #api-panel .api-drop:focus-visible {
      transform: translateX(-6px);
    }
    .api-remove {
      position: absolute;
      top: 50%;
      right: 1rem;
      width: 2rem;
      height: 2rem;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.6);
      color: rgba(203, 213, 225, 0.7);
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .api-remove[hidden] {
      display: none;
    }
    .api-remove:hover,
    .api-remove:focus-visible {
      outline: none;
      color: #f1f5f9;
      background: rgba(239, 68, 68, 0.35);
    }
    .api-remove svg {
      width: 1rem;
      height: 1rem;
    }
    .api-status {
      margin: 1.2rem 0 0;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(148, 163, 184, 0.8);
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }
    .api-status.is-error {
      color: #fca5a5;
    }
    /* Resultados: análogos terrestres de los datos del usuario */
    .api-results {
      margin-top: 2.2rem;
    }
    .api-region {
      margin: 1.6rem 0 0.4rem;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.85);
    }
    .api-note {
      margin: 0 0 0.9rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(148, 163, 184, 0.8);
    }
    .api-note.is-warning {
      color: #fcd34d;
    }
    /* Tarjeta informativa (sin acción): no se desplaza al pasar el mouse */
    #api-panel div.api-result {
      cursor: default;
    }
    #api-panel div.api-result:hover {
      transform: none;
    }
    .api-result.is-error .mission-meta {
      color: #fca5a5;
      text-transform: none;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }
    #api-panel .api-result[data-retry]:hover,
    #api-panel .api-result[data-retry]:focus-visible,
    #api-panel .api-reveal:not(:disabled):hover,
    #api-panel .api-reveal:not(:disabled):focus-visible {
      transform: translateX(-6px);
    }
    /* Botón «Show Earth analogs»: verificado, el icono y el marco se encienden */
    .api-reveal:not(:disabled)::before {
      opacity: 0.6;
    }
    .api-reveal:not(:disabled) .menu-icon {
      color: #60a5fa;
    }
    .api-reveal:disabled .mission-meta {
      animation: api-verifying 1.2s ease-in-out infinite alternate;
    }
    @keyframes api-verifying {
      to {
        opacity: 0.4;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .api-reveal:disabled .mission-meta {
        animation: none;
      }
    }
    .api-results h2:focus {
      outline: none;
    }
    /* Añadir una región analizada al sistema (Luna o Marte) */
    .api-save-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin: 0.2rem 0 0.4rem;
    }
    .api-action {
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(96, 165, 250, 0.45);
      border-radius: 2px;
      background: rgba(59, 130, 246, 0.14);
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #dbeafe;
      cursor: pointer;
      transition: color 0.25s ease, border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
    }
    .api-action:hover,
    .api-action:focus-visible {
      color: #fff;
      border-color: #60a5fa;
      background: rgba(59, 130, 246, 0.28);
      box-shadow: 0 0 12px -4px rgba(59, 130, 246, 0.8);
    }
    .api-action:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    .api-saved-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #86efac;
    }
    .api-saved-tag svg {
      width: 1rem;
      height: 1rem;
    }
    /* «My implementations»: terrenos guardados y botón para quitarlos todos */
    .api-saved {
      margin-top: 2.2rem;
    }
    .api-saved-item {
      padding-right: 3.6rem;
    }
    .api-saved-item .menu-icon {
      color: #60a5fa;
    }
    #api-panel .api-saved-item:hover,
    #api-panel .api-saved-item:focus-visible,
    #api-panel .api-clear:hover,
    #api-panel .api-clear:focus-visible {
      transform: translateX(-6px);
    }
    .api-clear .menu-icon {
      color: rgba(252, 165, 165, 0.8);
    }
    #api-panel .api-clear:hover,
    #api-panel .api-clear:focus-visible,
    #api-panel .api-clear.is-confirming {
      color: #fecaca;
      filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.55));
    }
    .api-clear.is-confirming .mission-meta {
      color: #fca5a5;
    }

    /* ---------- Panel de misiones (izquierda, mismo lenguaje visual que el menú) ---------- */
    #missions-panel {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #missions-panel.is-hidden {
      transform: translateX(-12px);
    }
    /* Oscurece el lado izquierdo para leer el panel sobre la escena, como el menú */
    #missions-backdrop {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(3, 5, 10, 0.65) 0%, rgba(3, 5, 10, 0.3) 32%, rgba(3, 5, 10, 0) 50%);
      transition: opacity 0.3s ease;
    }
    .missions-title {
      margin: 0;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 1.6vw, 1.3rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(226, 232, 240, 0.85);
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }
    .missions-title b {
      font-weight: 500;
      color: #60a5fa;
    }
    .missions-accent {
      width: min(14rem, 60vw);
      margin: 1.1rem 0 1.8rem;
    }
    /* Variante compacta de .menu-tag con dos líneas de texto */
    .menu-tag--mission {
      --chamfer: 16px;
      width: 100%;
      height: auto;
      min-height: 5rem;
      padding: 0.85rem 1.4rem 0.85rem 0;
      font-size: clamp(0.85rem, 1.15vw, 0.95rem);
      letter-spacing: 0.14em;
    }
    .menu-tag--mission .menu-icon-box {
      width: 4.2rem;
    }
    .menu-tag--mission .menu-icon {
      width: 1.5rem;
      height: 1.5rem;
    }
    .menu-tag--mission .menu-divider {
      height: 60%;
      align-self: center;
    }
    .menu-tag--mission .menu-label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding-left: 1.4rem;
      line-height: 1.3;
    }
    .menu-tag--mission .menu-arrow {
      width: 1.4rem;
      height: 1.4rem;
    }
    .mission-meta {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: rgba(148, 163, 184, 0.75);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s ease;
    }
    /* En lugar de alargarse (como en el menú) se desplaza un poco: el panel tiene ancho fijo */
    .menu-tag--mission:hover,
    .menu-tag--mission:focus-visible {
      width: 100%;
      transform: translateX(6px);
    }
    .menu-tag--mission {
      transition: color 0.3s ease, filter 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Entrada escalonada cada vez que aparece el panel */
    #missions-panel:not(.is-hidden) .menu-enter {
      animation: menu-enter 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(0.05s + var(--i, 0) * 0.08s);
    }
    #missions-panel:not(.is-hidden) .missions-accent {
      transform-origin: left center;
      animation: menu-accent-grow 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }
    @media (prefers-reduced-motion: reduce) {
      #missions-panel:not(.is-hidden) .menu-enter,
      #missions-panel:not(.is-hidden) .missions-accent {
        animation: none;
      }
    }

    /* ---------- Información del terreno seleccionado (izquierda) ---------- */
    #mission-info {
      transition: opacity 0.3s ease, transform 0.3s ease;
      overscroll-behavior: none;
    }
    /* En la comparación el panel no hace scroll: título y cabecera de la tabla quedan quietos y
       solo las filas (.cmp-scroll) se desplazan. Con position: sticky la cabecera se recolocaba
       en el hilo principal (ocupado con la escena 3D) y llegaba tarde: «rebotaba» */
    #mission-info.is-comparison {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-mask-image: none;
      mask-image: none;
    }
    #mission-info.is-comparison #mission-info-body {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    #mission-info.is-hidden {
      transform: translateX(-12px);
    }
    #mission-info:not(.is-hidden) .menu-enter {
      animation: menu-enter 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(0.05s + var(--i, 0) * 0.08s);
    }
    #mission-info:not(.is-hidden) .missions-accent {
      transform-origin: left center;
      animation: menu-accent-grow 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .info-name {
      margin: 0;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #eef2f8;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }
    .info-coords {
      margin: 0.5rem 0 0;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: rgba(203, 213, 225, 0.75);
      font-variant-numeric: tabular-nums;
    }
    .info-section {
      margin: 0 0 0.5rem;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(147, 197, 253, 0.9);
    }
    #mission-info section + section {
      margin-top: 1.2rem;
    }

    /* Análogos terrestres: tarjetas como las de misiones (.menu-tag--mission) con el % al final */
    .cmp-analogs {
      margin-top: 2.6rem;
    }
    .cmp-analogs .menu-options {
      gap: 1.6rem;
    }
    /* Filtro de misión: segmentos en fila sobre los análogos; el activo, con el azul del acento */
    .mission-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      width: min(28rem, calc(100vw - 32px));
    }
    #missions-filter {
      width: 100%;
      margin-bottom: 1.6rem;
    }
    .mission-filter-option {
      flex: 1 1 auto;
      padding: 0.55rem 0.8rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 2px;
      background: rgba(15, 23, 42, 0.35);
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(203, 213, 225, 0.65);
      cursor: pointer;
      transition: color 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
    }
    .mission-filter-option:hover,
    .mission-filter-option:focus-visible {
      color: #eef2f8;
      border-color: rgba(96, 165, 250, 0.6);
    }
    .mission-filter-option:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    .mission-filter-option[aria-pressed='true'] {
      color: #eef2f8;
      border-color: #60a5fa;
      background: rgba(59, 130, 246, 0.22);
      box-shadow: 0 0 12px -4px rgba(59, 130, 246, 0.8);
    }
    /* Coordenadas bajo el nombre del terreno: más tenues que el título */
    #mission-info-body > .info-coords {
      color: rgba(203, 213, 225, 0.5);
    }
    /* Frase que antecede al nombre del terreno («Análogos terrestres más parecidos a») */
    .info-lead {
      margin-bottom: 0.6rem;
      color: rgba(203, 213, 225, 0.75);
    }
    /* Similitud: anillo del color del texto de la tarjeta (sigue su resaltado); el número va en cian */
    .menu-score {
      position: relative;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 3.2rem;
      height: 3.2rem;
      margin-left: 1rem;
    }
    .menu-score::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(currentColor calc(var(--score) * 1%), rgba(148, 163, 184, 0.2) 0);
      /* Solo el aro: el centro queda transparente sobre la tarjeta */
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    }
    .menu-score b {
      position: relative;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #a5f3fc;
      font-variant-numeric: tabular-nums;
    }
    /* Hueco sin datos: misma tarjeta, apagada y sin interacción */
    .menu-tag.is-pending {
      cursor: default;
      opacity: 0.45;
    }
    .menu-tag.is-pending:hover {
      color: rgba(203, 213, 225, 0.65);
      filter: none;
      transform: none;
    }
    .menu-tag.is-pending:hover::before,
    .menu-tag.is-pending:hover::after {
      opacity: 0;
    }
    .menu-tag.is-pending:hover .menu-icon {
      color: rgba(203, 213, 225, 0.6);
    }
    /* Esqueleto mientras llegan los análogos: barras y anillo con un brillo que las recorre */
    .menu-tag.is-skeleton {
      opacity: 0.7;
    }
    .skeleton-bar {
      display: block;
      width: 11rem;
      max-width: 100%;
      height: 0.8rem;
      border-radius: 2px;
    }
    .skeleton-bar--short {
      width: 7rem;
      height: 0.6rem;
    }
    .skeleton-bar,
    .is-skeleton .menu-score::before {
      background: linear-gradient(100deg, rgba(148, 163, 184, 0.14) 40%, rgba(165, 243, 252, 0.32) 50%, rgba(148, 163, 184, 0.14) 60%);
      background-size: 300% 100%;
      animation: skeleton-shine 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-shine {
      from {
        background-position: 100% 0;
      }
      to {
        background-position: 0 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton-bar,
      .is-skeleton .menu-score::before {
        animation: none;
      }
    }

    /* Siguiente análogo: botón redondo con flecha a la derecha, centrado en el borde derecho
       entre los dos hologramas (solo en la comparativa; lo gestiona frontend/js/missionInfo.js) */
    #analog-switcher {
      position: fixed;
      top: 50%;
      right: 1rem;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      transform: translateY(-50%);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    @media (min-width: 640px) {
      #analog-switcher {
        right: 2.5rem;
      }
    }
    #analog-switcher.is-hidden {
      transform: translate(8px, -50%);
    }
    .analog-next {
      display: grid;
      place-items: center;
      width: 4.5rem;
      height: 4.5rem;
      padding: 0;
      border: 1px solid rgba(103, 232, 249, 0.45);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.14) 0%, rgba(8, 47, 73, 0.4) 70%);
      color: #a5f3fc;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.18);
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
    }
    .analog-next svg {
      width: 1.8rem;
      height: 1.8rem;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .analog-next:hover,
    .analog-next:focus-visible {
      outline: none;
      border-color: rgba(165, 243, 252, 0.9);
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.4);
    }
    .analog-next:hover svg,
    .analog-next:focus-visible svg {
      transform: translateX(3px);
    }
    .analog-next:active {
      transform: scale(0.95);
    }
    .analog-switcher-label {
      margin: 0;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      color: rgba(203, 213, 225, 0.7);
      font-variant-numeric: tabular-nums;
    }
    .analog-switcher-label b {
      display: block;
      margin-top: 0.3rem;
      font-weight: 600;
      color: #a5f3fc;
    }

    /* Cambio de análogo (carrusel): lo actual sale hacia la izquierda, escalonado, y lo nuevo
       entra desde la derecha. Dos ids para ganar a la entrada normal (#mission-info … .menu-enter) */
    #mission-info #mission-info-body.is-leaving > * {
      animation: cmp-leave 0.32s cubic-bezier(0.55, 0, 0.75, 0.2) both;
    }
    #mission-info #mission-info-body.is-leaving > :nth-child(2) {
      animation-delay: 0.03s;
    }
    #mission-info #mission-info-body.is-leaving > :nth-child(n + 3) {
      animation-delay: 0.06s;
    }
    #mission-info:not(.is-hidden) #mission-info-body.is-entering .menu-enter {
      animation: cmp-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc((var(--i, 0) - 2) * 0.05s);
    }
    #mission-info:not(.is-hidden) #mission-info-body.is-entering .missions-accent {
      animation: menu-accent-grow 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }
    @keyframes cmp-leave {
      to {
        opacity: 0;
        transform: translateX(-36px);
        filter: blur(3px);
      }
    }
    @keyframes cmp-enter {
      from {
        opacity: 0;
        transform: translateX(36px);
        filter: blur(3px);
      }
      to {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    .cmp-detail {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 1.3rem;
    }
    .cmp-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: none;
    }

    /* Viñeta de la comparativa: oscurece de izquierda a derecha hasta donde termina la tabla para
       que las estrellas no se confundan con datos. Elemento fijo aparte (no dentro del panel, que
       tiene scroll y mask-image) y solo con opacidad animada: no repinta al hacer scroll */
    #cmp-vignette {
      --cmp-end: calc(1.5rem + min(30rem, 100vw - 2rem));
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(3, 6, 12, 0.94) 0,
        rgba(3, 6, 12, 0.94) var(--cmp-end),
        rgba(3, 6, 12, 0.5) calc(var(--cmp-end) + 3rem),
        rgba(3, 6, 12, 0) calc(var(--cmp-end) + 9rem)
      );
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    /* El borde derecho del panel (sm:left-6) */
    @media (max-width: 639px) {
      #cmp-vignette {
        --cmp-end: calc(1rem + min(30rem, 100vw - 2rem));
      }
    }
    #cmp-vignette.is-visible {
      opacity: 1;
    }

    /* Flechas al pie de la tabla: avisan de que hay más filas y desaparecen al llegar al final */
    .cmp-more {
      position: absolute;
      left: 50%;
      bottom: 0.25rem;
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      margin-left: -1rem;
      padding: 0;
      border: 0;
      background: none;
      color: rgba(203, 213, 225, 0.7);
      cursor: pointer;
      transition: opacity 0.3s ease, color 0.2s ease;
      animation: cmp-more-bob 1.6s ease-in-out infinite;
    }
    .cmp-more:hover {
      color: #e2e8f0;
    }
    .cmp-more svg {
      width: 1.25rem;
      height: 1.25rem;
    }
    .cmp-scroll.is-scroll-end + .cmp-more {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes cmp-more-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cmp-more {
        animation: none;
      }
    }

    /* Tabla comparativa minimalista: variable | cuerpo | Tierra, sin fondos ni bordes duros */
    /* Dos tablas (cabecera fuera del scroll y filas dentro) con las mismas columnas fijas */
    .cmp-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.84rem;
      font-variant-numeric: tabular-nums;
    }
    .cmp-table col.cmp-col-value {
      width: 21%;
    }
    .cmp-table col.cmp-col-match {
      width: 17%;
    }
    /* Cabecera visible: fuera de la zona con scroll, nunca se mueve */
    .cmp-head th {
      padding: 0 0 0.8rem 1rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: right;
      color: rgba(203, 213, 225, 0.55);
    }
    /* La tabla de filas conserva su cabecera solo para lectores de pantalla */
    .cmp-scroll thead th {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .cmp-head th:first-child {
      padding-left: 0;
      text-align: left;
    }
    /* Punto de color en lugar de columnas tintadas */
    .cmp-col-body::before,
    .cmp-col-earth::before {
      content: '';
      display: inline-block;
      width: 0.4rem;
      height: 0.4rem;
      margin-right: 0.45rem;
      border-radius: 50%;
      vertical-align: 0.08em;
    }
    .cmp-col-body::before {
      background: #93c5fd;
    }
    .cmp-col-earth::before {
      background: #67e8f9;
    }
    /* Terreno concreto bajo el nombre de cada columna */
    .cmp-col-sub {
      display: block;
      margin-top: 0.3rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: none;
      color: rgba(148, 163, 184, 0.55);
    }
    .cmp-group th {
      padding: 1.6rem 0 0.5rem;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: left;
      color: rgba(148, 163, 184, 0.6);
    }
    /* Primer grupo pegado a la cabecera, que ya marca el inicio de la tabla */
    .cmp-scroll thead + tbody .cmp-group th {
      padding-top: 1rem;
    }
    .cmp-table tbody tr:not(.cmp-group) + tr:not(.cmp-group) {
      border-top: 1px solid rgba(148, 163, 184, 0.08);
    }
    .cmp-table tbody th[scope='row'] {
      padding: 0.6rem 1rem 0.6rem 0;
      font-weight: 400;
      text-align: left;
      color: rgba(226, 232, 240, 0.78);
    }
    /* Unidad junto al nombre, en tono apagado */
    .cmp-unit {
      margin-left: 0.4rem;
      font-size: 0.7rem;
      color: rgba(148, 163, 184, 0.5);
    }
    .cmp-table td {
      padding: 0.6rem 0 0.6rem 1rem;
      text-align: right;
      white-space: nowrap;
      color: #f1f5f9;
    }
    .cmp-table td.cmp-earth {
      color: #cffafe;
    }
    /* Compatibilidad de la variable (backend: knn.CompareFeatures). Paleta en la familia de tonos
       claros de la interfaz (azul #93c5fd, cian #67e8f9, ámbar #fcd34d): el color se mezcla entre
       las tres paradas según el porcentaje (frontend/js/missionInfo.js, matchCell) */
    .cmp-table {
      --match-high: #5eead4; /* verde agua: cerca del cian de la Tierra */
      --match-mid: #fcd34d; /* ámbar: el mismo de los avisos */
      --match-low: #fda4af; /* coral suave */
    }
    .cmp-table td.cmp-match {
      font-size: 0.74rem;
    }
    .cmp-empty {
      color: rgba(148, 163, 184, 0.35);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---------- Holograma del terreno (derecha de la Luna) ---------- */
    .hologram-beam {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 11;
      pointer-events: none;
      overflow: visible;
      transition: opacity 0.5s ease;
    }
    .hologram-beam.is-occluded {
      opacity: 0;
    }
    .hologram-beam-shape {
      animation: holo-flicker 3.2s steps(1) infinite;
    }
    .hologram-beam-edges {
      fill: none;
      stroke: rgba(103, 232, 249, 0.55);
      stroke-width: 1;
    }
    .hologram {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 12;
      /* Dos hologramas apilados (Luna y Tierra): cada uno cabe en menos de la mitad del alto */
      width: min(clamp(200px, 19vw, 280px), 38vh);
      aspect-ratio: 1;
      pointer-events: none;
      transition: opacity 0.4s ease;
      will-change: transform;
    }
    /* La posición la fija JS con transform en .hologram; la animación de apertura va en el interior */
    .holo-inner {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(103, 232, 249, 0.35);
      border-radius: 4px;
      background: radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.14) 0%, rgba(8, 47, 73, 0.28) 70%);
      box-shadow: 0 0 32px rgba(34, 211, 238, 0.2), inset 0 0 40px rgba(34, 211, 238, 0.12);
      transform-origin: left center;
    }
    .hologram:not(.is-hidden) .holo-inner {
      animation: holo-open 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both, holo-flicker 4s steps(1) 1.2s infinite;
    }
    .holo-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .holo-shape {
      fill: rgba(103, 232, 249, 0.2);
      stroke: #67e8f9;
      stroke-width: 0.018;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(103, 232, 249, 0.7));
    }
    /* Fantasma del terreno de la misión: la forma del análogo se acerca a él según la similitud */
    .holo-target {
      fill: none;
      stroke: rgba(165, 243, 252, 0.55);
      stroke-width: 0.012;
      stroke-dasharray: 0.04 0.035;
      stroke-linejoin: round;
    }
    .holo-badge-ring {
      fill: none;
      stroke: #a5f3fc;
      stroke-width: 0.018;
    }
    .holo-badge {
      fill: rgba(165, 243, 252, 0.35);
      stroke: #a5f3fc;
      stroke-width: 0.012;
    }
    /* Escala justo encima del nombre (el ancho de la barra lo fija JS en % de la tarjeta) */
    .holo-scale {
      position: absolute;
      left: 10px;
      bottom: 26px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 0.56rem;
      letter-spacing: 0.06em;
      color: rgba(165, 243, 252, 0.9);
    }
    .holo-scale-bar {
      height: 1.5px;
      background: #a5f3fc;
    }
    .holo-header,
    .holo-name {
      position: absolute;
      left: 10px;
      right: 10px;
      margin: 0;
      font-family: 'Montserrat', 'Inter', sans-serif;
      text-transform: uppercase;
      color: rgba(165, 243, 252, 0.88);
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
    }
    .holo-header {
      top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      white-space: nowrap;
    }
    /* El texto largo se recorta con "…"; la etiqueta derecha (ID o similitud) siempre completa */
    .holo-kicker {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .holo-tag {
      flex-shrink: 0;
      color: #e0fbff;
    }
    .holo-name {
      bottom: 8px;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Líneas de barrido y franja que recorre el holograma */
    .holo-scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(103, 232, 249, 0.07) 0 1px, transparent 1px 3px);
    }
    .holo-scan::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 18%;
      background: linear-gradient(180deg, transparent, rgba(103, 232, 249, 0.12), transparent);
      animation: holo-sweep 3.5s linear infinite;
    }
    /* Cambio de análogo con la tarjeta abierta: el contenido se apaga y vuelve a sintonizarse */
    .hologram.is-switching .holo-svg,
    .hologram.is-switching .holo-header,
    .hologram.is-switching .holo-scale,
    .hologram.is-switching .holo-name {
      animation: holo-retune 0.9s cubic-bezier(0.45, 0, 0.25, 1) both;
    }
    .hologram.is-switching .holo-scan::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(165, 243, 252, 0.28), transparent);
      animation: holo-wipe 0.9s cubic-bezier(0.45, 0, 0.25, 1) both;
    }
    @keyframes holo-retune {
      0% {
        opacity: 1;
        filter: none;
      }
      35% {
        opacity: 0.08;
        filter: blur(3px);
      }
      100% {
        opacity: 1;
        filter: none;
      }
    }
    @keyframes holo-wipe {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(100%);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .hologram.is-switching .holo-svg,
      .hologram.is-switching .holo-header,
      .hologram.is-switching .holo-scale,
      .hologram.is-switching .holo-name,
      .hologram.is-switching .holo-scan::before {
        animation: none;
      }
    }
    @keyframes holo-open {
      from {
        opacity: 0;
        transform: scaleX(0.03);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes holo-sweep {
      from {
        transform: translateY(-100%);
      }
      to {
        transform: translateY(560%);
      }
    }
    /* Parpadeo breve e irregular */
    @keyframes holo-flicker {
      0%, 46%, 49%, 100% {
        opacity: 1;
      }
      47% {
        opacity: 0.72;
      }
      48% {
        opacity: 0.9;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .hologram:not(.is-hidden) .holo-inner,
      .hologram-beam-shape,
      .holo-scan::after,
      #mission-info:not(.is-hidden) .menu-enter,
      #mission-info:not(.is-hidden) .missions-accent {
        animation: none;
      }
    }

    /* ---------- Botones de la escena (mismo lenguaje visual que .menu-tag) ---------- */
    .hud-btn {
      --chamfer: 9px;
      --frame: polygon(var(--chamfer) 0, calc(100% - var(--chamfer)) 0, 100% 36%, 100% 64%, calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%, 0 64%, 0 36%);
      --edge: linear-gradient(90deg, #3b82f6 0%, #93c5fd 45%, #60a5fa 75%, #2563eb 100%);
      --tint: rgba(59, 130, 246, 0.22);
      --glow: rgba(59, 130, 246, 0.55);
      --accent: #60a5fa;
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      min-height: 2.5rem;
      padding: 0 1.1rem;
      border: 0;
      background: none;
      cursor: pointer;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(203, 213, 225, 0.7);
      transition: color 0.3s ease, filter 0.3s ease, opacity 0.4s ease, transform 0.15s ease;
    }

    /* Marco: borde (::before) y relleno (::after). En reposo se ve un marco tenue */
    .hud-btn::before,
    .hud-btn::after {
      content: '';
      position: absolute;
      z-index: -1;
      clip-path: var(--frame);
      transition: opacity 0.3s ease;
    }
    .hud-btn::before {
      inset: 0;
      background: rgba(148, 163, 184, 0.28);
    }
    .hud-btn::after {
      inset: 1px;
      background: linear-gradient(180deg, rgba(14, 24, 48, 0.88) 0%, rgba(6, 11, 26, 0.88) 100%);
    }

    /* Capa luminosa (borde degradado + relleno teñido) que aparece al resaltar */
    .hud-btn > .hud-frame {
      position: absolute;
      inset: 0;
      z-index: -1;
      clip-path: var(--frame);
      background: var(--edge);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .hud-btn > .hud-frame::after {
      content: '';
      position: absolute;
      inset: 1.5px;
      clip-path: var(--frame);
      background:
        radial-gradient(120% 140% at 100% 100%, var(--tint) 0%, transparent 45%),
        linear-gradient(180deg, rgba(14, 24, 48, 0.94) 0%, rgba(6, 11, 26, 0.94) 100%);
    }

    .hud-icon {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
      color: rgba(203, 213, 225, 0.6);
      transition: color 0.3s ease;
    }

    .hud-divider {
      width: 1px;
      height: 1rem;
      background: rgba(203, 213, 225, 0.25);
      flex-shrink: 0;
    }

    .hud-btn:hover,
    .hud-btn:focus-visible {
      outline: none;
      color: #f1f5f9;
      filter: drop-shadow(0 0 8px var(--glow));
    }
    .hud-btn:hover > .hud-frame,
    .hud-btn:focus-visible > .hud-frame {
      opacity: 1;
    }
    .hud-btn:hover .hud-icon,
    .hud-btn:focus-visible .hud-icon {
      color: var(--accent);
    }
    .hud-btn:active {
      transform: scale(0.97);
    }

    @media (prefers-reduced-motion: reduce) {
      .hud-btn,
      .hud-btn > .hud-frame {
        transition: none;
      }
    }
  </style>

  <!-- Import Map oficial de Three.js r164 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Contenedor WebGL de pantalla completa -->
  <div id="canvas-container"></div>

  <!-- Menú principal (Orión de fondo) -->
  <nav id="main-menu" aria-label="Main menu">
    <h1 class="menu-title menu-enter" style="--i: 0">HailMary</h1>
    <p class="menu-description menu-enter" style="--i: 1">Identify Earth Locations that Analog<br />the Permanent Moon Base Locations and Mars</p>
    <div class="menu-accent" aria-hidden="true"></div>
    <ul class="menu-options">
      <li class="menu-enter" style="--i: 3">
        <button class="menu-tag" data-action="moon">
          <span class="menu-icon-box">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
          </span>
          <span class="menu-divider"></span>
          <span class="menu-label">Moon missions</span>
          <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="m14 6 6 6-6 6"/></svg>
        </button>
      </li>
      <li class="menu-enter" style="--i: 4">
        <button class="menu-tag" data-action="mars">
          <span class="menu-icon-box">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6 9.5c2 1 4 .5 5.5-.5M10 16c1.5-1 3.5-1 5 .5M14.5 7.5l1.5 1"/></svg>
          </span>
          <span class="menu-divider"></span>
          <span class="menu-label">Mars missions</span>
          <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="m14 6 6 6-6 6"/></svg>
        </button>
      </li>
      <li class="menu-enter" style="--i: 5">
        <button class="menu-tag" data-action="api">
          <span class="menu-icon-box">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg>
          </span>
          <span class="menu-divider"></span>
          <span class="menu-label">API</span>
          <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="m14 6 6 6-6 6"/></svg>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Volver al menú principal -->
  <button
    id="open-menu-btn"
    data-scene-ui
    aria-label="Back to main menu"
    class="hud-btn fixed top-4 left-4 sm:top-6 sm:left-6 z-30"
  >
    <span class="hud-frame" aria-hidden="true"></span>
    <svg xmlns="http://www.w3.org/2000/svg" class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12H4"></path>
      <path d="m10 6-6 6 6 6"></path>
    </svg>
    <span class="hud-divider hidden sm:block"></span>
    <span class="hidden sm:inline">Back to menu</span>
  </button>

  <!-- Volver a la lista de misiones: sustituye al botón del menú mientras hay una misión abierta -->
  <button
    id="back-to-missions-btn"
    aria-label="Back to missions"
    class="hud-btn is-hidden fixed top-4 left-4 sm:top-6 sm:left-6 z-30"
  >
    <span class="hud-frame" aria-hidden="true"></span>
    <svg xmlns="http://www.w3.org/2000/svg" class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12H4"></path>
      <path d="m10 6-6 6 6 6"></path>
    </svg>
    <span class="hud-divider hidden sm:block"></span>
    <span id="back-to-missions-label" class="hidden sm:inline">Back to missions</span>
  </button>

  <!-- Viñeta: solo con una misión seleccionada, para que se lean los botones -->
  <div id="mission-vignette" aria-hidden="true"></div>

  <!-- Panel de misiones disponibles (se muestra al enfocar la Luna o Marte) -->
  <div data-scene-ui>
    <div id="missions-backdrop" class="is-hidden" aria-hidden="true"></div>
    <!-- Viñeta tras la tabla comparativa (la muestra frontend/js/missionInfo.js) -->
    <div id="cmp-vignette" aria-hidden="true"></div>
    <aside
      id="missions-panel"
      aria-label="Available missions"
      aria-hidden="true"
      class="is-hidden fixed top-20 left-4 sm:top-24 sm:left-6 z-20 w-[min(26rem,calc(100vw-2rem))] max-h-[calc(100vh-8rem)] overflow-y-auto overflow-x-hidden scroll-fade pl-1 pr-3 py-1"
    >
      <h2 class="missions-title menu-enter" style="--i: 0">Available missions · <b id="missions-count"></b></h2>
      <div class="menu-accent missions-accent" aria-hidden="true"></div>
      <div id="missions-filter" class="mission-filter menu-enter" style="--i: 1" role="group" aria-label="Filter terrains by mission"></div>
      <p id="missions-status" class="sr-only" role="status"></p>
      <ul id="missions-list" class="menu-options" aria-label="Terrains: pick one to see its Earth analogs"></ul>
    </aside>

    <!-- Información del terreno seleccionado (sustituye a la lista de misiones) -->
    <aside
      id="mission-info"
      aria-label="Terrain information"
      aria-hidden="true"
      class="is-hidden fixed top-20 left-4 sm:top-24 sm:left-6 z-20 w-[min(30rem,calc(100vw-2rem))] max-h-[calc(100vh-8rem)] overflow-y-auto overflow-x-hidden scroll-fade pl-1 pr-3 py-1"
    >
      <div id="mission-info-body"></div>
    </aside>

    <!-- Siguiente análogo de la comparativa (lo gestiona frontend/js/missionInfo.js) -->
    <div id="analog-switcher" class="is-hidden" aria-hidden="true">
      <button type="button" class="analog-next" data-step="1" tabindex="-1" aria-label="Next Earth analog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="m14 6 6 6-6 6"></path></svg>
      </button>
      <p class="analog-switcher-label" aria-live="polite">Next analog<b><span id="analog-switcher-current">1</span> / <span id="analog-switcher-total">3</span></b></p>
    </div>

    <!-- Vista API (satélite): arrastrar y soltar los JSON (lo gestiona frontend/js/apiPanel.js) -->
    <aside
      id="api-panel"
      aria-label="API data upload"
      aria-hidden="true"
      class="is-hidden fixed top-1/2 right-4 sm:right-6 z-20 w-[min(26rem,calc(100vw-2rem))] max-h-[calc(100vh-8rem)] overflow-y-auto overflow-x-hidden scroll-fade pl-3 pr-1 py-1"
    >
      <h2 class="missions-title menu-enter" style="--i: 0">API · <b>Upload data</b></h2>
      <div class="menu-accent missions-accent" aria-hidden="true"></div>
      <ul id="api-slots" class="menu-options"></ul>
      <p id="api-status" class="api-status menu-enter" style="--i: 4" aria-live="polite"></p>
      <input id="api-file-input" type="file" accept=".json,application/json" hidden />
      <!-- Terrenos propios añadidos al sistema (guardados en este navegador) -->
      <section id="api-saved" class="api-saved" aria-label="My implementations" hidden>
        <h2 class="missions-title menu-enter" style="--i: 0">My <b>implementations</b></h2>
        <div class="menu-accent missions-accent" aria-hidden="true"></div>
        <ul id="api-saved-list" class="menu-options"></ul>
      </section>
      <section id="api-results" class="api-results" aria-live="polite" hidden></section>
    </aside>

    <!-- Hologramas de terreno (Luna o Marte, y Tierra): los construye frontend/js/hologram.js -->
    <div id="holograms"></div>
  </div>

  <!-- Escena 3D (Three.js, módulos ES en ./js) -->
  <script type="module" src="./frontend/js/main.js"></script>
</body>
</html>
