<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planeta Tierra 3D Interactivo - Tierra, Luna y Marte</title>
  <!-- Tailwind CSS para la interfaz flotante -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070c;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* Estilo vidrio esmerilado oscuro (#121212) */
    .glass-panel {
      background: rgba(18, 18, 18, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    }

    /* Personalización de controles deslizantes */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #0f172a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.75);
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #0f172a;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.75);
      cursor: pointer;
    }

    /* Scrollbar discreto para pantallas muy pequeñas */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
    }
  </style>

  <!-- Import Map oficial de Three.js r164 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Contenedor WebGL de pantalla completa -->
  <div id="canvas-container"></div>

  <!-- Botón flotante para mostrar/ocultar el panel de controles -->
  <button
    id="toggle-panel-btn"
    aria-label="Mostrar u ocultar controles"
    class="fixed top-4 right-4 sm:top-6 sm:right-6 z-30 glass-panel hover:bg-neutral-800/90 active:scale-95 text-slate-100 p-3 rounded-xl transition-all flex items-center gap-2 text-xs font-medium cursor-pointer"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="4" y1="21" x2="4" y2="14"></line>
      <line x1="4" y1="10" x2="4" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="12"></line>
      <line x1="12" y1="8" x2="12" y2="3"></line>
      <line x1="20" y1="21" x2="20" y2="16"></line>
      <line x1="20" y1="12" x2="20" y2="3"></line>
      <line x1="1" y1="14" x2="7" y2="14"></line>
      <line x1="9" y1="8" x2="15" y2="8"></line>
      <line x1="17" y1="16" x2="23" y2="16"></line>
    </svg>
    <span class="hidden sm:inline">Controles</span>
  </button>

  <!-- Panel lateral flotante de controles -->
  <aside
    id="control-panel"
    class="fixed top-16 right-4 sm:top-20 sm:right-6 z-20 glass-panel rounded-2xl p-4 sm:p-5 w-[calc(100vw-2rem)] max-w-xs sm:w-80 max-h-[calc(100vh-11rem)] overflow-y-auto custom-scroll transition-all duration-300"
  >
    <div class="flex items-center justify-between pb-3 mb-3.5 border-b border-white/10">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-200">
        Panel de Control
      </span>
      <button
        id="reset-camera-btn"
        class="text-[11px] text-sky-400 hover:text-sky-300 font-medium transition-colors cursor-pointer"
      >
        Centrar vista
      </button>
    </div>

    <div class="space-y-4">
      <!-- 1. Selector de Enfoque de Cámara -->
      <div class="space-y-1.5">
        <span class="text-xs text-slate-300 block">Ir a</span>
        <div class="grid grid-cols-4 gap-1 bg-black/50 p-1 rounded-xl border border-white/10">
          <button
            id="focus-earth-btn"
            class="py-1.5 px-1 rounded-lg text-[11px] font-medium bg-sky-500/25 text-sky-200 border border-sky-400/40 transition-all cursor-pointer"
          >
            Tierra
          </button>
          <button
            id="focus-moon-btn"
            class="py-1.5 px-1 rounded-lg text-[11px] font-medium text-slate-400 hover:text-white border border-transparent transition-all cursor-pointer"
          >
            Luna
          </button>
          <button
            id="focus-mars-btn"
            class="py-1.5 px-1 rounded-lg text-[11px] font-medium text-slate-400 hover:text-white border border-transparent transition-all cursor-pointer"
          >
            Marte
          </button>
          <button
            id="focus-satellite-btn"
            class="py-1.5 px-1 rounded-lg text-[11px] font-medium text-slate-400 hover:text-white border border-transparent transition-all cursor-pointer"
          >
            Satélite
          </button>
        </div>
      </div>

      <!-- 2. Botón Pausar / Reanudar -->
      <div class="flex items-center justify-between">
        <span class="text-xs text-slate-300">Rotación de los planetas</span>
        <button
          id="toggle-rotation-btn"
          class="px-3 py-1.5 rounded-xl bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/40 text-sky-200 text-xs font-medium flex items-center gap-1.5 transition-all cursor-pointer"
        >
          <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
          <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span id="rotation-btn-label">Pausar</span>
        </button>
      </div>

      <!-- 3. Control deslizante: Velocidad de rotación -->
      <div class="space-y-1.5">
        <div class="flex justify-between text-xs">
          <label for="speed-slider" class="text-slate-300">Velocidad de rotación</label>
          <span id="speed-value" class="text-sky-300 font-mono font-medium">1.0x</span>
        </div>
        <input
          id="speed-slider"
          type="range"
          min="0"
          max="4"
          step="0.1"
          value="1.0"
        />
      </div>

      <!-- 4. Interruptores (Nubes y Atmósfera) -->
      <div class="pt-2.5 border-t border-white/10 grid grid-cols-2 gap-2">
        <!-- Nubes -->
        <button
          id="toggle-clouds-btn"
          class="p-2.5 rounded-xl border border-sky-400/40 bg-sky-500/20 text-white text-xs font-medium flex items-center justify-between transition-all cursor-pointer"
        >
          <span class="flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-sky-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
            </svg>
            Nubes
          </span>
          <span id="clouds-status" class="w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
        </button>

        <!-- Atmósfera -->
        <button
          id="toggle-atmosphere-btn"
          class="p-2.5 rounded-xl border border-sky-400/40 bg-sky-500/20 text-white text-xs font-medium flex items-center justify-between transition-all cursor-pointer"
        >
          <span class="flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-sky-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
            </svg>
            Atmósfera
          </span>
          <span id="atmosphere-status" class="w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_8px_#38bdf8]"></span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Lógica 3D completa en Three.js -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /**
     * Estado reactivo de la simulación
     */
    const state = {
      isRotating: true,
      rotationSpeed: 1.0,
      showClouds: true,
      showAtmosphere: true,
      isPanelOpen: true,
      cameraFocus: 'earth', // 'earth' | 'moon' | 'mars' | 'satellite'
      // Posiciones fijas (ángulos) de cada cuerpo alrededor de la Tierra
      moonOrbitAngle: 0.65,
      marsOrbitAngle: 0.9, // Marte detrás de la Luna (misma dirección desde la Tierra): vuelos sin giros bruscos
      satOrbitAngle: 1.1
    };

    // Referencias globales de Three.js
    const container = document.getElementById('canvas-container');
    let scene, camera, renderer, controls;
    let earthTiltGroup, earthMesh, cloudsMesh, atmosphereMesh, starField;
    let moonOrbitGroup, moonPivotGroup, moonMesh;
    let marsOrbitGroup, marsTiltGroup, marsMesh, marsAtmosphereMesh;
    let satOrbitGroup, satPivotGroup, satellite;
    let satWings = [];
    let satBlinkers = [];
    let sunLight, ambientLight;
    const clock = new THREE.Clock();

    // Vuelo de cámara entre cuerpos: interpola posición y objetivo con un arco suave
    const FLIGHT_MIN_DURATION = 0.8; // segundos (trayectos cortos)
    const FLIGHT_MAX_DURATION = 1.6; // segundos (trayectos largos, p. ej. Tierra → Marte)
    const flight = {
      active: false,
      t: 0,
      duration: 1,
      arc: 0,
      fromCam: new THREE.Vector3(),
      toCam: new THREE.Vector3(),
      fromTarget: new THREE.Vector3(),
      toTarget: new THREE.Vector3(),
      minDistance: 2.6,
      maxDistance: 12
    };
    // Esferas que la cámara nunca atraviesa durante el vuelo (se rellenan al crear los cuerpos)
    const flightObstacles = [];
    const obstacleCenter = new THREE.Vector3();
    const obstacleOffset = new THREE.Vector3();

    // Dimensiones y constantes orbitales
    const EARTH_RADIUS = 2.0;
    const CLOUDS_RADIUS = 2.028;
    const ATMOSPHERE_RADIUS = 2.16;
    const EARTH_AXIAL_TILT = THREE.MathUtils.degToRad(23.44);

    const MOON_RADIUS = EARTH_RADIUS * 0.273; // 0.546 unidades
    const MOON_ORBIT_RADIUS = 7.6;
    const MOON_ORBIT_INCLINATION = THREE.MathUtils.degToRad(5.14);
    const MOON_AXIAL_TILT = THREE.MathUtils.degToRad(6.68);

    const MARS_RADIUS = EARTH_RADIUS * 0.532; // 1.064 unidades
    const MARS_ATMOSPHERE_RADIUS = MARS_RADIUS * 1.055;
    const MARS_ORBIT_RADIUS_X = 16.5;
    const MARS_ORBIT_RADIUS_Z = 15.6;
    const MARS_ORBIT_INCLINATION = THREE.MathUtils.degToRad(1.85);
    const MARS_AXIAL_TILT = THREE.MathUtils.degToRad(25.19);

    const SAT_ORBIT_RADIUS = 2.95;
    const SAT_ORBIT_INCLINATION = THREE.MathUtils.degToRad(51.6);
    const SAT_SCALE = 0.034; // el modelo se construye en unidades locales (~12.5 de envergadura)
    const satWorldQuatInv = new THREE.Quaternion();
    const satLocalLight = new THREE.Vector3();

    // Luz que acompaña a la cámara: llega desde el punto de vista, ligeramente desplazada
    // hacia arriba-izquierda para conservar volumen y relieve en los planetas
    const HEADLIGHT_OFFSET = new THREE.Vector3(-0.35, 0.3, 1).normalize();
    const HEADLIGHT_DISTANCE = 40;
    const lightDirection = new THREE.Vector3();

    /**
     * Texturas fotográficas reales (NASA Blue Marble / Clementine / Viking vía three.js y threex.planets).
     * Se cargan en segundo plano; mientras tanto (o si falla la red) se usan las procedurales.
     */
    const THREE_TEX = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r164/examples/textures/planets/';
    const PLANETS_TEX = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/';
    // Cada entrada: [versión local 4K en ./textures, respaldo CDN de menor resolución]
    const LOCAL_TEX = './textures/';
    const REAL_TEXTURES = {
      earthDay: [LOCAL_TEX + 'earth_day_4k.jpg', THREE_TEX + 'earth_atmos_2048.jpg'],
      earthSpecular: [LOCAL_TEX + 'earth_specular_2k.jpg', THREE_TEX + 'earth_specular_2048.jpg'],
      earthNormal: [LOCAL_TEX + 'earth_normal_2k.jpg', THREE_TEX + 'earth_normal_2048.jpg'],
      earthClouds: [LOCAL_TEX + 'earth_clouds_4k.jpg', null],
      earthCloudsFallback: THREE_TEX + 'earth_clouds_1024.png',
      moonColor: [LOCAL_TEX + 'moon_4k.jpg', PLANETS_TEX + 'moonmap1k.jpg'],
      moonBump: [LOCAL_TEX + 'moon_bump_2k.jpg', PLANETS_TEX + 'moonbump1k.jpg'],
      marsColor: [LOCAL_TEX + 'mars_4k.jpg', PLANETS_TEX + 'marsmap1k.jpg'],
      marsBump: [LOCAL_TEX + 'mars_bump_1k.jpg', PLANETS_TEX + 'marsbump1k.jpg']
    };

    /**
     * Inicializa escena, cámara, luces, cuerpos celestes y eventos
     */
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070c);

      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 1.4, 6.2);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.65;
      controls.zoomSpeed = 0.85;
      controls.enablePan = false;
      // Si el usuario toma el control durante un vuelo, se detiene ahí mismo
      controls.addEventListener('start', () => {
        if (!flight.active) return;
        flight.active = false;
        controls.minDistance = flight.minDistance;
        controls.maxDistance = flight.maxDistance;
      });

      setupLighting();
      createStarfield();
      createEarthSystem();
      createMoonSystem();
      createMarsSystem();
      createSatelliteSystem();

      // Radios de seguridad (incluyen atmósferas) que el vuelo de cámara nunca atraviesa
      flightObstacles.push(
        { object: earthMesh, safeRadius: 2.5 },
        { object: moonMesh, safeRadius: MOON_RADIUS * 1.5 },
        { object: marsMesh, safeRadius: MARS_RADIUS * 1.4 },
        { object: satellite, safeRadius: 0.3 }
      );

      // Arranca directamente en la Tierra (sin vista general)
      setCameraFocus('earth', true);

      setupUIEvents();
      window.addEventListener('resize', onWindowResize);

      loadRealisticTextures();
    }

    /**
     * Descarga en paralelo los mapas fotográficos y los sustituye cuerpo por cuerpo.
     * Si alguna textura falla, ese cuerpo conserva su versión procedural.
     */
    function loadRealisticTextures() {
      const loader = new THREE.TextureLoader();
      const anisotropy = renderer.capabilities.getMaxAnisotropy();

      // Intenta la versión local 4K y, si no está disponible (p. ej. abierto como file://), usa el CDN
      const load = ([localUrl, cdnUrl], isColor) =>
        loader
          .loadAsync(localUrl)
          .catch((err) => (cdnUrl ? loader.loadAsync(cdnUrl) : Promise.reject(err)))
          .then((tex) => {
            if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = anisotropy;
            return tex;
          });

      const swap = (mesh, maps, props) => {
        const mat = mesh.material;
        Object.entries(maps).forEach(([key, tex]) => {
          if (mat[key] && mat[key] !== tex) mat[key].dispose();
          mat[key] = tex;
        });
        Object.assign(mat, props);
        mat.needsUpdate = true;
      };

      // Tierra: color diurno, océanos especulares y relieve normal
      Promise.all([
        load(REAL_TEXTURES.earthDay, true),
        load(REAL_TEXTURES.earthSpecular, false),
        load(REAL_TEXTURES.earthNormal, false)
      ])
        .then(([day, spec, normal]) => {
          swap(
            earthMesh,
            { map: day, specularMap: spec, normalMap: normal, bumpMap: null },
            { normalScale: new THREE.Vector2(0.85, -0.85), specular: new THREE.Color(0x4a6a8a), shininess: 22 }
          );
        })
        .catch((err) => console.warn('Texturas de la Tierra no disponibles, usando procedurales.', err));

      // Nubes 4K (escala de grises usada como transparencia); respaldo: PNG del CDN
      load(REAL_TEXTURES.earthClouds, false)
        .then((clouds) => {
          swap(cloudsMesh, { map: null, alphaMap: clouds }, { color: new THREE.Color(0xffffff), opacity: 0.95 });
        })
        .catch(() =>
          load([REAL_TEXTURES.earthCloudsFallback, null], true).then((clouds) => {
            swap(cloudsMesh, { map: clouds, alphaMap: null }, { opacity: 0.9 });
          })
        )
        .catch((err) => console.warn('Textura de nubes no disponible.', err));

      // Luna: mosaico LRO/Clementine con relieve de cráteres
      Promise.all([load(REAL_TEXTURES.moonColor, true), load(REAL_TEXTURES.moonBump, false)])
        .then(([color, bump]) => {
          swap(moonMesh, { map: color, bumpMap: bump }, { bumpScale: 1.0, roughness: 0.97, metalness: 0 });
        })
        .catch((err) => console.warn('Texturas de la Luna no disponibles.', err));

      // Marte: mosaico Viking con relieve topográfico
      Promise.all([load(REAL_TEXTURES.marsColor, true), load(REAL_TEXTURES.marsBump, false)])
        .then(([color, bump]) => {
          swap(marsMesh, { map: color, bumpMap: bump }, { bumpScale: 2.0, roughness: 0.93, metalness: 0 });
        })
        .catch((err) => console.warn('Texturas de Marte no disponibles.', err));
    }

    /**
     * Iluminación ambiental tenue y luz direccional solar con sombras reales
     */
    function setupLighting() {
      ambientLight = new THREE.AmbientLight(0x1e293b, 0.36);
      scene.add(ambientLight);

      const hemiLight = new THREE.HemisphereLight(0x38bdf8, 0x05070c, 0.18);
      scene.add(hemiLight);

      // Luz principal ligada a la cámara: la cara visible de cada planeta siempre queda iluminada.
      // Sin sombras: con la luz junto al observador quedarían ocultas detrás de los cuerpos.
      sunLight = new THREE.DirectionalLight(0xfffbeb, 2.95);
      scene.add(sunLight);
      scene.add(sunLight.target);
      updateHeadlight();
    }

    /**
     * Coloca la luz junto a la cámara (apuntando al objetivo de la vista)
     * y sincroniza la dirección de luz de los shaders atmosféricos
     */
    function updateHeadlight() {
      lightDirection.copy(HEADLIGHT_OFFSET).applyQuaternion(camera.quaternion);
      sunLight.target.position.copy(controls.target);
      sunLight.position.copy(controls.target).addScaledVector(lightDirection, HEADLIGHT_DISTANCE);

      if (atmosphereMesh) atmosphereMesh.material.uniforms.sunDirection.value.copy(lightDirection);
      if (marsAtmosphereMesh) marsAtmosphereMesh.material.uniforms.sunDirection.value.copy(lightDirection);
    }

    /**
     * Campo espacial de 4,500 estrellas con variación de brillo y tono estelar
     */
    function createStarfield() {
      const starCount = 4500;
      const positions = new Float32Array(starCount * 3);
      const colors = new Float32Array(starCount * 3);

      const palette = [
        new THREE.Color(0xffffff),
        new THREE.Color(0xcbd5e1),
        new THREE.Color(0xbae6fd),
        new THREE.Color(0xfef3c7),
        new THREE.Color(0xfed7aa)
      ];

      for (let i = 0; i < starCount; i++) {
        const radius = 130 + Math.random() * 240;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = radius * Math.cos(phi);

        const baseColor = palette[Math.floor(Math.random() * palette.length)];
        const brightness = 0.45 + Math.random() * 0.55;
        colors[i * 3] = baseColor.r * brightness;
        colors[i * 3 + 1] = baseColor.g * brightness;
        colors[i * 3 + 2] = baseColor.b * brightness;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.72,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.92
      });

      starField = new THREE.Points(geometry, material);
      scene.add(starField);
    }

    /**
     * Genera texturas procedurales de alta resolución para la Tierra:
     * - Mapa difuso (océanos profundos, plataformas continentales, selvas, desiertos, cordilleras y polos)
     * - Mapa especular (brillo solar sobre océanos y cero brillo en tierra firme)
     * - Mapa de relieve bump (cordilleras y topografía continental)
     * - Mapa alfa de nubes (bandas ciclónicas y frentes nubosos)
     */
    function createEarthProceduralTextures() {
      const width = 1024;
      const height = 512;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = width;
      colorCanvas.height = height;
      const ctx = colorCanvas.getContext('2d');

      const specCanvas = document.createElement('canvas');
      specCanvas.width = width;
      specCanvas.height = height;
      const sCtx = specCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = width;
      bumpCanvas.height = height;
      const bCtx = bumpCanvas.getContext('2d');

      const cloudCanvas = document.createElement('canvas');
      cloudCanvas.width = width;
      cloudCanvas.height = height;
      const cCtx = cloudCanvas.getContext('2d');

      // 1. Océanos base (difuso = azul profundo, especular = blanco para reflejo solar)
      const oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
      oceanGrad.addColorStop(0.0, '#103460');
      oceanGrad.addColorStop(0.25, '#0b2c59');
      oceanGrad.addColorStop(0.5, '#09254d');
      oceanGrad.addColorStop(0.75, '#0b2c59');
      oceanGrad.addColorStop(1.0, '#103460');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0, 0, width, height);

      sCtx.fillStyle = '#d8d8d8';
      sCtx.fillRect(0, 0, width, height);

      bCtx.fillStyle = '#404040';
      bCtx.fillRect(0, 0, width, height);

      // Generador determinista para formas continentales naturales
      let seed = 4242;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      // Masas continentales principales (América, Eurasia, África, Australia, Groenlandia)
      const landmasses = [
        // América del Norte
        { x: 225, y: 155, rx: 85, ry: 55, rot: -0.25, desert: false },
        { x: 255, y: 205, rx: 45, ry: 32, rot: 0.2, desert: true },
        // América del Sur
        { x: 315, y: 310, rx: 48, ry: 78, rot: 0.18, desert: false },
        // Groenlandia
        { x: 375, y: 78, rx: 38, ry: 22, rot: -0.2, ice: true },
        // África
        { x: 545, y: 265, rx: 62, ry: 78, rot: -0.08, desert: true },
        // Europa
        { x: 545, y: 148, rx: 55, ry: 34, rot: 0.1, desert: false },
        // Asia
        { x: 715, y: 155, rx: 135, ry: 68, rot: 0.06, desert: false },
        { x: 675, y: 215, rx: 68, ry: 35, rot: -0.1, desert: true },
        // Australia
        { x: 825, y: 345, rx: 46, ry: 30, rot: -0.15, desert: true }
      ];

      landmasses.forEach((land) => {
        // Plataforma continental costera turquesa en el océano
        ctx.save();
        ctx.translate(land.x, land.y);
        ctx.rotate(land.rot);
        const shelfGrad = ctx.createRadialGradient(0, 0, land.rx * 0.4, 0, 0, land.rx * 1.24);
        shelfGrad.addColorStop(0, 'rgba(20, 115, 165, 0.75)');
        shelfGrad.addColorStop(0.7, 'rgba(15, 85, 138, 0.45)');
        shelfGrad.addColorStop(1, 'rgba(11, 44, 89, 0)');
        ctx.fillStyle = shelfGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, land.rx * 1.24, land.ry * 1.24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Sub-lóbulos orgánicos para costas irregulares
        const lobeCount = 26;
        for (let i = 0; i < lobeCount; i++) {
          const angle = (i / lobeCount) * Math.PI * 2;
          const distFactor = 0.25 + rand() * 0.58;
          const lx = land.x + Math.cos(angle + land.rot) * land.rx * distFactor;
          const ly = land.y + Math.sin(angle + land.rot) * land.ry * distFactor;
          const lr = (land.rx + land.ry) * (0.14 + rand() * 0.16);

          // Color del bioma
          const landGrad = ctx.createRadialGradient(lx, ly, lr * 0.1, lx, ly, lr);
          if (land.ice) {
            landGrad.addColorStop(0, '#f1f5f9');
            landGrad.addColorStop(0.85, '#cbd5e1');
            landGrad.addColorStop(1, 'rgba(203, 213, 225, 0)');
          } else if (land.desert && rand() > 0.35) {
            landGrad.addColorStop(0, '#c29b61');
            landGrad.addColorStop(0.65, '#8a7c46');
            landGrad.addColorStop(0.92, '#3b6e3c');
            landGrad.addColorStop(1, 'rgba(59, 110, 60, 0)');
          } else {
            landGrad.addColorStop(0, '#275931');
            landGrad.addColorStop(0.65, '#3b733e');
            landGrad.addColorStop(0.92, '#5c8a47');
            landGrad.addColorStop(1, 'rgba(92, 138, 71, 0)');
          }

          ctx.fillStyle = landGrad;
          ctx.beginPath();
          ctx.arc(lx, ly, lr, 0, Math.PI * 2);
          ctx.fill();

          // Quitar brillo especular sobre tierra firme
          sCtx.fillStyle = '#080808';
          sCtx.beginPath();
          sCtx.arc(lx, ly, lr * 0.94, 0, Math.PI * 2);
          sCtx.fill();

          // Elevación topográfica en mapa bump
          const bGrad = bCtx.createRadialGradient(lx, ly, lr * 0.1, lx, ly, lr);
          bGrad.addColorStop(0, '#dcdcdc');
          bGrad.addColorStop(0.7, '#9a9a9a');
          bGrad.addColorStop(1, 'rgba(64, 64, 64, 0)');
          bCtx.fillStyle = bGrad;
          bCtx.beginPath();
          bCtx.arc(lx, ly, lr, 0, Math.PI * 2);
          bCtx.fill();
        }
      });

      // Casquetes polares Ártico y Antártico
      const northIce = ctx.createLinearGradient(0, 0, 0, 38);
      northIce.addColorStop(0, '#f8fafc');
      northIce.addColorStop(0.7, 'rgba(241, 245, 249, 0.85)');
      northIce.addColorStop(1, 'rgba(241, 245, 249, 0)');
      ctx.fillStyle = northIce;
      ctx.fillRect(0, 0, width, 38);

      const southIce = ctx.createLinearGradient(0, height - 42, 0, height);
      southIce.addColorStop(0, 'rgba(241, 245, 249, 0)');
      southIce.addColorStop(0.3, 'rgba(241, 245, 249, 0.9)');
      southIce.addColorStop(1, '#f8fafc');
      ctx.fillStyle = southIce;
      ctx.fillRect(0, height - 42, width, 42);

      // 2. Capa de nubes procedurales (bandas atmosféricas y espirales ciclónicas)
      cCtx.clearRect(0, 0, width, height);
      for (let i = 0; i < 320; i++) {
        const cx = rand() * width;
        const cy = 28 + rand() * (height - 56);
        const rx = 18 + rand() * 68;
        const ry = 5 + rand() * 16;
        const rot = (rand() - 0.5) * 0.35;

        cCtx.save();
        cCtx.translate(cx, cy);
        cCtx.rotate(rot);
        const cloudGrad = cCtx.createRadialGradient(0, 0, 2, 0, 0, rx);
        cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0.72)');
        cloudGrad.addColorStop(0.55, 'rgba(248, 250, 252, 0.35)');
        cloudGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        cCtx.fillStyle = cloudGrad;
        cCtx.beginPath();
        cCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        cCtx.fill();
        cCtx.restore();
      }

      const anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 4;

      const mapTex = new THREE.CanvasTexture(colorCanvas);
      mapTex.colorSpace = THREE.SRGBColorSpace;
      mapTex.anisotropy = anisotropy;

      const specTex = new THREE.CanvasTexture(specCanvas);
      specTex.anisotropy = anisotropy;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = anisotropy;

      const cloudTex = new THREE.CanvasTexture(cloudCanvas);
      cloudTex.anisotropy = anisotropy;

      return { mapTex, specTex, bumpTex, cloudTex };
    }

    /**
     * Genera texturas procedurales de alta definición para la Luna (mares basálticos y cráteres)
     */
    function createMoonProceduralTextures() {
      const width = 1024;
      const height = 512;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = width;
      colorCanvas.height = height;
      const ctx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = width;
      bumpCanvas.height = height;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(0, 0, width, height);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, width, height);

      let seed = 9001;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      // Mares lunares (regiones oscuras de basalto)
      const maria = [
        { x: 340, y: 185, rx: 95, ry: 68 },
        { x: 455, y: 175, rx: 72, ry: 55 },
        { x: 530, y: 215, rx: 64, ry: 52 },
        { x: 270, y: 235, rx: 85, ry: 90 },
        { x: 420, y: 265, rx: 60, ry: 45 }
      ];

      maria.forEach((m) => {
        const grad = ctx.createRadialGradient(m.x, m.y, 10, m.x, m.y, m.rx);
        grad.addColorStop(0, 'rgba(65, 70, 78, 0.78)');
        grad.addColorStop(0.7, 'rgba(82, 88, 96, 0.45)');
        grad.addColorStop(1, 'rgba(156, 163, 175, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(m.x, m.y, m.rx, m.ry, 0.2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Cráteres de impacto con bordes brillantes y relieve profundo
      for (let i = 0; i < 420; i++) {
        const cx = rand() * width;
        const cy = 18 + rand() * (height - 36);
        const r = 2 + Math.pow(rand(), 2.6) * 24;

        const cGrad = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        cGrad.addColorStop(0, 'rgba(72, 76, 84, 0.65)');
        cGrad.addColorStop(0.72, 'rgba(125, 130, 138, 0.35)');
        cGrad.addColorStop(0.9, 'rgba(229, 231, 235, 0.68)');
        cGrad.addColorStop(1, 'rgba(156, 163, 175, 0)');
        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        const bGrad = bCtx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        bGrad.addColorStop(0, 'rgba(25, 25, 25, 0.85)');
        bGrad.addColorStop(0.72, 'rgba(110, 110, 110, 0.5)');
        bGrad.addColorStop(0.9, 'rgba(245, 245, 245, 0.9)');
        bGrad.addColorStop(1, 'rgba(128, 128, 128, 0)');
        bCtx.fillStyle = bGrad;
        bCtx.beginPath();
        bCtx.arc(cx, cy, r, 0, Math.PI * 2);
        bCtx.fill();
      }

      const anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 4;
      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = anisotropy;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = anisotropy;

      return { colorTex, bumpTex };
    }

    /**
     * Genera texturas procedurales de alta definición para Marte:
     * tonos óxido/terracota, Valles Marineris, cráteres y casquetes polares blancos
     */
    function createMarsProceduralTextures() {
      const width = 1024;
      const height = 512;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = width;
      colorCanvas.height = height;
      const ctx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = width;
      bumpCanvas.height = height;
      const bCtx = bumpCanvas.getContext('2d');

      const baseGrad = ctx.createLinearGradient(0, 0, 0, height);
      baseGrad.addColorStop(0.0, '#d6b49c');
      baseGrad.addColorStop(0.15, '#c85a32');
      baseGrad.addColorStop(0.5, '#b84824');
      baseGrad.addColorStop(0.85, '#c4562e');
      baseGrad.addColorStop(1.0, '#d6b49c');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, width, height);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, width, height);

      let seed = 1337;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      // Regiones basálticas oscuras (Syrtis Major, Mare Erythraeum)
      const darkRegions = [
        { x: 240, y: 210, rx: 130, ry: 75, rot: -0.25 },
        { x: 460, y: 290, rx: 165, ry: 85, rot: 0.15 },
        { x: 690, y: 185, rx: 120, ry: 70, rot: 0.3 },
        { x: 840, y: 270, rx: 140, ry: 80, rot: -0.18 },
        { x: 120, y: 310, rx: 110, ry: 65, rot: 0.1 }
      ];

      darkRegions.forEach((reg) => {
        ctx.save();
        ctx.translate(reg.x, reg.y);
        ctx.rotate(reg.rot);
        const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, reg.rx);
        grad.addColorStop(0, 'rgba(82, 30, 16, 0.68)');
        grad.addColorStop(0.6, 'rgba(110, 42, 22, 0.38)');
        grad.addColorStop(1, 'rgba(110, 42, 22, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, reg.rx, reg.ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Mesetas brillantes de polvo ocre (Tharsis, Elysium)
      for (let i = 0; i < 45; i++) {
        const px = rand() * width;
        const py = 50 + rand() * (height - 100);
        const pr = 25 + rand() * 75;
        const pGrad = ctx.createRadialGradient(px, py, 3, px, py, pr);
        pGrad.addColorStop(0, 'rgba(228, 126, 74, 0.42)');
        pGrad.addColorStop(1, 'rgba(228, 126, 74, 0)');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();

        const bGrad = bCtx.createRadialGradient(px, py, 3, px, py, pr);
        bGrad.addColorStop(0, 'rgba(185, 185, 185, 0.35)');
        bGrad.addColorStop(1, 'rgba(128, 128, 128, 0)');
        bCtx.fillStyle = bGrad;
        bCtx.beginPath();
        bCtx.arc(px, py, pr, 0, Math.PI * 2);
        bCtx.fill();
      }

      // Valles Marineris (gran cañón ecuatorial)
      ctx.save();
      ctx.strokeStyle = 'rgba(68, 22, 11, 0.74)';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(280, 268);
      ctx.bezierCurveTo(340, 278, 410, 262, 475, 274);
      ctx.stroke();

      bCtx.strokeStyle = 'rgba(20, 20, 20, 0.85)';
      bCtx.lineWidth = 9;
      bCtx.lineCap = 'round';
      bCtx.beginPath();
      bCtx.moveTo(280, 268);
      bCtx.bezierCurveTo(340, 278, 410, 262, 475, 274);
      bCtx.stroke();
      ctx.restore();

      // Cráteres marcianos con relieve
      for (let i = 0; i < 280; i++) {
        const cx = rand() * width;
        const cy = 36 + rand() * (height - 72);
        const r = 2 + Math.pow(rand(), 2.4) * 20;

        const cGrad = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        cGrad.addColorStop(0, 'rgba(92, 34, 18, 0.55)');
        cGrad.addColorStop(0.75, 'rgba(166, 72, 38, 0.25)');
        cGrad.addColorStop(0.92, 'rgba(232, 138, 86, 0.48)');
        cGrad.addColorStop(1, 'rgba(166, 72, 38, 0)');
        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        const bGrad = bCtx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
        bGrad.addColorStop(0, 'rgba(35, 35, 35, 0.8)');
        bGrad.addColorStop(0.75, 'rgba(115, 115, 115, 0.45)');
        bGrad.addColorStop(0.9, 'rgba(235, 235, 235, 0.85)');
        bGrad.addColorStop(1, 'rgba(128, 128, 128, 0)');
        bCtx.fillStyle = bGrad;
        bCtx.beginPath();
        bCtx.arc(cx, cy, r, 0, Math.PI * 2);
        bCtx.fill();
      }

      // Casquetes polares blancos (Norte y Sur)
      const northCap = ctx.createLinearGradient(0, 0, 0, 44);
      northCap.addColorStop(0, 'rgba(255, 250, 245, 0.96)');
      northCap.addColorStop(0.55, 'rgba(248, 236, 226, 0.78)');
      northCap.addColorStop(1, 'rgba(248, 236, 226, 0)');
      ctx.fillStyle = northCap;
      ctx.fillRect(0, 0, width, 44);

      const southCap = ctx.createLinearGradient(0, height - 36, 0, height);
      southCap.addColorStop(0, 'rgba(248, 236, 226, 0)');
      southCap.addColorStop(0.45, 'rgba(248, 236, 226, 0.75)');
      southCap.addColorStop(1, 'rgba(255, 250, 245, 0.95)');
      ctx.fillStyle = southCap;
      ctx.fillRect(0, height - 36, width, 36);

      const anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 4;
      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = anisotropy;

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = anisotropy;

      return { colorTex, bumpTex };
    }

    /**
     * Construye el planeta Tierra con inclinación axial de 23.44°, nubes y halo Fresnel
     */
    function createEarthSystem() {
      earthTiltGroup = new THREE.Group();
      earthTiltGroup.rotation.z = EARTH_AXIAL_TILT;
      scene.add(earthTiltGroup);

      const textures = createEarthProceduralTextures();

      // Esfera terrestre con reflejo especular oceánico y relieve continental
      const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 160, 160);
      const earthMaterial = new THREE.MeshPhongMaterial({
        map: textures.mapTex,
        specularMap: textures.specTex,
        specular: new THREE.Color(0x60a5fa),
        shininess: 28,
        bumpMap: textures.bumpTex,
        bumpScale: 0.025
      });

      earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
      earthMesh.castShadow = true;
      earthMesh.receiveShadow = true;
      earthTiltGroup.add(earthMesh);

      // Capa independiente de nubes semitransparentes
      const cloudsGeometry = new THREE.SphereGeometry(CLOUDS_RADIUS, 160, 160);
      const cloudsMaterial = new THREE.MeshStandardMaterial({
        map: textures.cloudTex,
        alphaMap: textures.cloudTex,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        roughness: 0.9
      });

      cloudsMesh = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
      cloudsMesh.receiveShadow = true;
      earthTiltGroup.add(cloudsMesh);

      // Atmósfera azulada con shader Fresnel sensible al ángulo solar
      const atmGeometry = new THREE.SphereGeometry(ATMOSPHERE_RADIUS, 72, 72);
      const atmMaterial = new THREE.ShaderMaterial({
        uniforms: {
          sunDirection: { value: sunLight.position.clone().normalize() },
          dayColor: { value: new THREE.Color(0x38bdf8) },
          twilightColor: { value: new THREE.Color(0x1d4ed8) }
        },
        vertexShader: /* glsl */ `
          varying vec3 vNormal;
          varying vec3 vWorldPosition;

          void main() {
            vNormal = normalize(mat3(modelMatrix) * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 sunDirection;
          uniform vec3 dayColor;
          uniform vec3 twilightColor;

          varying vec3 vNormal;
          varying vec3 vWorldPosition;

          void main() {
            vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
            vec3 normal = normalize(vNormal);

            float viewDot = dot(normal, viewDirection);
            float fresnel = pow(clamp(0.68 - viewDot, 0.0, 1.0), 3.1);

            float sunAlignment = dot(normal, normalize(sunDirection));
            float dayFactor = smoothstep(-0.35, 0.75, sunAlignment);

            vec3 finalColor = mix(twilightColor, dayColor, dayFactor);
            float alpha = fresnel * (0.14 + 0.76 * dayFactor);

            gl_FragColor = vec4(finalColor, alpha);
          }
        `,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });

      atmosphereMesh = new THREE.Mesh(atmGeometry, atmMaterial);
      earthTiltGroup.add(atmosphereMesh);
    }

    /**
     * Construye la Luna en órbita inclinada 5.14° con acoplamiento de marea y sombras
     */
    function createMoonSystem() {
      moonOrbitGroup = new THREE.Group();
      moonOrbitGroup.rotation.z = MOON_ORBIT_INCLINATION;
      scene.add(moonOrbitGroup);

      // Pivote de posición fija (la Luna muestra siempre la misma cara a la Tierra)
      moonPivotGroup = new THREE.Group();
      moonPivotGroup.rotation.y = state.moonOrbitAngle;
      moonOrbitGroup.add(moonPivotGroup);

      const moonTextures = createMoonProceduralTextures();
      const moonGeometry = new THREE.SphereGeometry(MOON_RADIUS, 128, 128);
      const moonMaterial = new THREE.MeshStandardMaterial({
        map: moonTextures.colorTex,
        bumpMap: moonTextures.bumpTex,
        bumpScale: 0.025,
        roughness: 0.92,
        metalness: 0.02
      });

      moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
      moonMesh.position.set(MOON_ORBIT_RADIUS, 0, 0);
      // Orden ZYX: primero gira sobre su eje (Y) y luego se aplica la inclinación (Z),
      // así el eje queda fijo e inclinado en lugar de bambolearse
      moonMesh.rotation.order = 'ZYX';
      moonMesh.rotation.z = MOON_AXIAL_TILT;
      moonMesh.castShadow = true;
      moonMesh.receiveShadow = true;
      moonPivotGroup.add(moonMesh);
    }

    /**
     * Construye Marte en órbita exterior con inclinación axial de 25.19° y tenue atmósfera rojiza
     */
    function createMarsSystem() {
      marsOrbitGroup = new THREE.Group();
      marsOrbitGroup.rotation.z = MARS_ORBIT_INCLINATION;
      marsOrbitGroup.rotation.x = THREE.MathUtils.degToRad(-1.4);
      scene.add(marsOrbitGroup);

      // Grupo con inclinación axial de 25.19°
      marsTiltGroup = new THREE.Group();
      marsTiltGroup.rotation.z = MARS_AXIAL_TILT;
      marsTiltGroup.position.set(
        Math.cos(state.marsOrbitAngle) * MARS_ORBIT_RADIUS_X,
        0,
        Math.sin(state.marsOrbitAngle) * MARS_ORBIT_RADIUS_Z
      );
      marsOrbitGroup.add(marsTiltGroup);

      const marsTextures = createMarsProceduralTextures();
      const marsGeometry = new THREE.SphereGeometry(MARS_RADIUS, 128, 128);
      const marsMaterial = new THREE.MeshStandardMaterial({
        map: marsTextures.colorTex,
        bumpMap: marsTextures.bumpTex,
        bumpScale: 0.032,
        roughness: 0.88,
        metalness: 0.03
      });

      marsMesh = new THREE.Mesh(marsGeometry, marsMaterial);
      marsMesh.castShadow = true;
      marsMesh.receiveShadow = true;
      marsTiltGroup.add(marsMesh);

      // Tenue atmósfera rojiza marciana con shader Fresnel
      const marsAtmGeometry = new THREE.SphereGeometry(MARS_ATMOSPHERE_RADIUS, 64, 64);
      const marsAtmMaterial = new THREE.ShaderMaterial({
        uniforms: {
          sunDirection: { value: sunLight.position.clone().normalize() },
          glowColor: { value: new THREE.Color(0xf97316) },
          dustColor: { value: new THREE.Color(0xfdba74) }
        },
        vertexShader: /* glsl */ `
          varying vec3 vNormal;
          varying vec3 vWorldPosition;

          void main() {
            vNormal = normalize(mat3(modelMatrix) * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 sunDirection;
          uniform vec3 glowColor;
          uniform vec3 dustColor;

          varying vec3 vNormal;
          varying vec3 vWorldPosition;

          void main() {
            vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
            vec3 normal = normalize(vNormal);

            float viewDot = dot(normal, viewDirection);
            float fresnel = pow(clamp(0.62 - viewDot, 0.0, 1.0), 3.8);

            float sunAlignment = dot(normal, normalize(sunDirection));
            float dayFactor = smoothstep(-0.35, 0.7, sunAlignment);

            vec3 finalColor = mix(glowColor, dustColor, clamp(sunAlignment + 0.4, 0.0, 1.0));
            float alpha = fresnel * (0.08 + 0.44 * dayFactor);

            gl_FragColor = vec4(finalColor, alpha);
          }
        `,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false
      });

      marsAtmosphereMesh = new THREE.Mesh(marsAtmGeometry, marsAtmMaterial);
      marsTiltGroup.add(marsAtmosphereMesh);
    }

    /**
     * Texturas procedurales del satélite: aislamiento multicapa (MLI) dorado arrugado,
     * celdas solares de triple unión, reverso de paneles, radiadores de espejo (OSR) y halo de luces
     */
    function createSatelliteTextures() {
      let seed = 2718;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };
      const makeCanvas = (w, h) => {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        return [c, c.getContext('2d')];
      };
      const anisotropy = renderer.capabilities.getMaxAnisotropy();
      const toTexture = (canvas, isColor) => {
        const tex = new THREE.CanvasTexture(canvas);
        if (isColor) tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = anisotropy;
        return tex;
      };

      // 1. MLI dorado: facetas arrugadas + pliegues + cinta de unión
      const S = 1024;
      const [mliCanvas, m] = makeCanvas(S, S);
      const [mliBumpCanvas, mb] = makeCanvas(S, S);
      m.fillStyle = '#c99430';
      m.fillRect(0, 0, S, S);
      mb.fillStyle = '#808080';
      mb.fillRect(0, 0, S, S);

      for (let i = 0; i < 900; i++) {
        const cx = rand() * S;
        const cy = rand() * S;
        const r = 20 + rand() * 70;
        const sides = 3 + Math.floor(rand() * 3);
        const bright = rand() > 0.5;
        const g = Math.floor(70 + rand() * 130);
        m.fillStyle = bright
          ? `rgba(255, 228, 140, ${0.05 + rand() * 0.18})`
          : `rgba(90, 52, 8, ${0.05 + rand() * 0.2})`;
        mb.fillStyle = `rgba(${g}, ${g}, ${g}, 0.35)`;
        m.beginPath();
        mb.beginPath();
        for (let k = 0; k < sides; k++) {
          const a = (k / sides) * Math.PI * 2 + rand() * 0.8;
          const px = cx + Math.cos(a) * r * (0.5 + rand() * 0.6);
          const py = cy + Math.sin(a) * r * (0.5 + rand() * 0.6);
          if (k === 0) {
            m.moveTo(px, py);
            mb.moveTo(px, py);
          } else {
            m.lineTo(px, py);
            mb.lineTo(px, py);
          }
        }
        m.closePath();
        mb.closePath();
        m.fill();
        mb.fill();
      }

      for (let i = 0; i < 260; i++) {
        let x = rand() * S;
        let y = rand() * S;
        const light = rand() > 0.5;
        m.strokeStyle = light ? 'rgba(255, 240, 190, 0.45)' : 'rgba(70, 40, 5, 0.45)';
        mb.strokeStyle = light ? 'rgba(235, 235, 235, 0.6)' : 'rgba(25, 25, 25, 0.6)';
        m.lineWidth = mb.lineWidth = 1 + rand() * 2;
        m.beginPath();
        mb.beginPath();
        m.moveTo(x, y);
        mb.moveTo(x, y);
        for (let k = 0; k < 4; k++) {
          x += (rand() - 0.5) * 120;
          y += (rand() - 0.5) * 120;
          m.lineTo(x, y);
          mb.lineTo(x, y);
        }
        m.stroke();
        mb.stroke();
      }

      m.fillStyle = 'rgba(214, 220, 228, 0.55)';
      mb.fillStyle = 'rgba(150, 150, 150, 0.8)';
      [S * 0.34, S * 0.67].forEach((p) => {
        m.fillRect(p - 6, 0, 12, S);
        m.fillRect(0, p - 6, S, 12);
        mb.fillRect(p - 6, 0, 12, S);
        mb.fillRect(0, p - 6, S, 12);
      });

      // 2. Celdas solares (12 x 8 por panel) con esquinas recortadas, busbars y dedos colectores
      const PW = 1024;
      const PH = 640;
      const [solarCanvas, s] = makeCanvas(PW, PH);
      s.fillStyle = '#aeb6c2';
      s.fillRect(0, 0, PW, PH);
      const cols = 12;
      const rows = 8;
      const border = 14;
      const gap = 4;
      const cw = (PW - border * 2 - gap * (cols - 1)) / cols;
      const ch = (PH - border * 2 - gap * (rows - 1)) / rows;
      const cut = Math.min(cw, ch) * 0.14;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = border + c * (cw + gap);
          const y = border + r * (ch + gap);
          const t = rand() * 0.08;
          const grad = s.createLinearGradient(x, y, x + cw, y + ch);
          grad.addColorStop(0, `rgb(${(20 + t * 120) | 0}, ${(40 + t * 140) | 0}, ${(96 + t * 180) | 0})`);
          grad.addColorStop(1, '#0a1736');
          s.fillStyle = grad;
          s.beginPath();
          s.moveTo(x + cut, y);
          s.lineTo(x + cw - cut, y);
          s.lineTo(x + cw, y + cut);
          s.lineTo(x + cw, y + ch - cut);
          s.lineTo(x + cw - cut, y + ch);
          s.lineTo(x + cut, y + ch);
          s.lineTo(x, y + ch - cut);
          s.lineTo(x, y + cut);
          s.closePath();
          s.fill();

          s.strokeStyle = 'rgba(150, 172, 215, 0.1)';
          s.lineWidth = 1;
          for (let fy = y + 5; fy < y + ch - 3; fy += 5) {
            s.beginPath();
            s.moveTo(x + 2, fy);
            s.lineTo(x + cw - 2, fy);
            s.stroke();
          }
          s.strokeStyle = 'rgba(205, 214, 228, 0.45)';
          s.lineWidth = 1.4;
          for (let b = 1; b <= 2; b++) {
            const bx = x + (cw * b) / 3;
            s.beginPath();
            s.moveTo(bx, y + 2);
            s.lineTo(bx, y + ch - 2);
            s.stroke();
          }
        }
      }

      // 3. Reverso de los paneles (sustrato de fibra de carbono con kapton claro)
      const [backCanvas, bk] = makeCanvas(512, 320);
      bk.fillStyle = '#d4d8de';
      bk.fillRect(0, 0, 512, 320);
      bk.strokeStyle = 'rgba(40, 48, 60, 0.18)';
      bk.lineWidth = 2;
      for (let x = 0; x <= 512; x += 64) {
        bk.beginPath();
        bk.moveTo(x, 0);
        bk.lineTo(x, 320);
        bk.stroke();
      }
      for (let y = 0; y <= 320; y += 64) {
        bk.beginPath();
        bk.moveTo(0, y);
        bk.lineTo(512, y);
        bk.stroke();
      }

      // 4. Radiadores OSR: mosaico de pequeñas baldosas de espejo
      const R = 512;
      const [radCanvas, rc] = makeCanvas(R, R);
      rc.fillStyle = '#5d6672';
      rc.fillRect(0, 0, R, R);
      const tile = R / 16;
      for (let ty = 0; ty < 16; ty++) {
        for (let tx = 0; tx < 16; tx++) {
          const v = 200 + Math.floor(rand() * 40);
          rc.fillStyle = `rgb(${v}, ${v + 4}, ${v + 10})`;
          rc.fillRect(tx * tile + 1.5, ty * tile + 1.5, tile - 3, tile - 3);
        }
      }

      // 5. Halo radial para las luces de navegación
      const [glowCanvas, gl] = makeCanvas(128, 128);
      const glowGrad = gl.createRadialGradient(64, 64, 0, 64, 64, 64);
      glowGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      glowGrad.addColorStop(0.25, 'rgba(255, 255, 255, 0.55)');
      glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      gl.fillStyle = glowGrad;
      gl.fillRect(0, 0, 128, 128);

      return {
        mliMap: toTexture(mliCanvas, true),
        mliBump: toTexture(mliBumpCanvas, false),
        solarMap: toTexture(solarCanvas, true),
        panelBackMap: toTexture(backCanvas, true),
        radiatorMap: toTexture(radCanvas, true),
        glowMap: toTexture(glowCanvas, true)
      };
    }

    /**
     * Construye el modelo detallado del satélite (unidades locales; -Y apunta a la Tierra)
     */
    function buildSatelliteModel() {
      const tex = createSatelliteTextures();

      // Mapa de entorno para reflejos metálicos realistas (solo afecta al satélite)
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();

      const mat = {
        mli: new THREE.MeshStandardMaterial({
          map: tex.mliMap, bumpMap: tex.mliBump, bumpScale: 1.5,
          metalness: 1, roughness: 0.32, envMap, envMapIntensity: 0.9
        }),
        radiator: new THREE.MeshStandardMaterial({
          map: tex.radiatorMap, metalness: 0.85, roughness: 0.16, envMap, envMapIntensity: 1.0
        }),
        frame: new THREE.MeshStandardMaterial({
          color: 0x9aa1ab, metalness: 0.85, roughness: 0.38, envMap, envMapIntensity: 0.7
        }),
        dark: new THREE.MeshStandardMaterial({
          color: 0x2b2f36, metalness: 0.8, roughness: 0.42, envMap, envMapIntensity: 0.6
        }),
        white: new THREE.MeshStandardMaterial({
          color: 0xf1f3f5, metalness: 0.05, roughness: 0.55, envMap, envMapIntensity: 0.5, side: THREE.DoubleSide
        }),
        solar: new THREE.MeshStandardMaterial({
          map: tex.solarMap, metalness: 0.55, roughness: 0.22, envMap, envMapIntensity: 1.1
        }),
        panelBack: new THREE.MeshStandardMaterial({
          map: tex.panelBackMap, metalness: 0.2, roughness: 0.7, envMap, envMapIntensity: 0.4
        }),
        lens: new THREE.MeshStandardMaterial({
          color: 0x05070c, metalness: 0.3, roughness: 0.05, envMap, envMapIntensity: 1.4
        }),
        engine: new THREE.MeshStandardMaterial({
          color: 0x4a4038, metalness: 0.9, roughness: 0.3, envMap, envMapIntensity: 0.8, side: THREE.DoubleSide
        })
      };

      const root = new THREE.Group();
      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const UP = V(0, 1, 0);

      const add = (geometry, material, x = 0, y = 0, z = 0, parent = root) => {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        parent.add(mesh);
        return mesh;
      };

      // Barra cilíndrica entre dos puntos
      const strut = (a, b, radius, material, parent = root) => {
        const dir = new THREE.Vector3().subVectors(b, a);
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dir.length(), 10), material);
        mesh.position.copy(a).addScaledVector(dir, 0.5);
        mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
        parent.add(mesh);
        return mesh;
      };

      // Tobera tipo campana (abre hacia +Y local)
      const bellGeometry = (scale) =>
        new THREE.LatheGeometry(
          [V(0.06, 0, 0), V(0.075, 0.04, 0), V(0.1, 0.1, 0), V(0.15, 0.2, 0), V(0.21, 0.32, 0)].map(
            (p) => new THREE.Vector2(p.x * scale, p.y * scale)
          ),
          32
        );

      // --- Cuerpo principal (bus) ---
      const W = 1.2;
      const H = 1.5;
      const D = 1.2;
      // Orden de caras: +X, -X, +Y, -Y, +Z, -Z
      add(new THREE.BoxGeometry(W, H, D), [mat.mli, mat.mli, mat.mli, mat.mli, mat.radiator, mat.radiator]);

      // Estructura de aristas de aluminio
      const e = 0.05;
      for (const a of [-1, 1]) {
        for (const b of [-1, 1]) {
          add(new THREE.BoxGeometry(W + e, e, e), mat.frame, 0, (a * H) / 2, (b * D) / 2);
          add(new THREE.BoxGeometry(e, H + e, e), mat.frame, (a * W) / 2, 0, (b * D) / 2);
          add(new THREE.BoxGeometry(e, e, D + e), mat.frame, (a * W) / 2, (b * H) / 2, 0);
        }
      }

      // --- Cubierta superior (anti-Tierra) ---
      const top = H / 2;
      add(new THREE.CylinderGeometry(0.12, 0.14, 0.06, 32), mat.dark, 0, top + 0.03, 0);
      add(bellGeometry(1), mat.engine, 0, top + 0.06, 0);

      // Rastreadores estelares con parasol y lente
      [[0.36, 0.36], [-0.36, 0.36]].forEach(([x, z]) => {
        const tracker = new THREE.Group();
        tracker.position.set(x, top, z);
        tracker.rotation.set(0.35, 0, -Math.sign(x) * 0.35);
        root.add(tracker);
        add(new THREE.CylinderGeometry(0.07, 0.07, 0.16, 24), mat.dark, 0, 0.08, 0, tracker);
        add(new THREE.CylinderGeometry(0.06, 0.06, 0.012, 24), mat.lens, 0, 0.165, 0, tracker);
        add(new THREE.CylinderGeometry(0.115, 0.075, 0.14, 24, 1, true), mat.white, 0, 0.23, 0, tracker);
      });

      // Antena omnidireccional y parche GPS
      strut(V(0.38, top, -0.38), V(0.38, top + 0.5, -0.38), 0.012, mat.frame);
      add(new THREE.SphereGeometry(0.03, 16, 16), mat.white, 0.38, top + 0.5, -0.38);
      add(new THREE.BoxGeometry(0.24, 0.02, 0.24), mat.white, -0.36, top + 0.01, -0.36);
      add(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 24), mat.white, -0.36, top + 0.04, -0.36);

      // Propulsores de control de actitud en las cuatro aristas verticales
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const thruster = add(bellGeometry(0.32), mat.engine, sx * 0.63, 0.55, sz * 0.63);
          thruster.quaternion.setFromUnitVectors(UP, V(sx, 0.25, sz).normalize());
        }
      }

      // --- Cubierta inferior (cara a la Tierra): antena parabólica de alta ganancia ---
      const bottom = -H / 2;
      const dishR = 0.75;
      const focal = 0.42;
      const depth = (dishR * dishR) / (4 * focal);
      const dishVertexY = bottom - 0.2;
      add(new THREE.CylinderGeometry(0.06, 0.08, 0.2, 16), mat.frame, 0, bottom - 0.1, 0);

      const profile = [];
      for (let i = 0; i <= 28; i++) {
        const r = (dishR * i) / 28;
        profile.push(new THREE.Vector2(Math.max(r, 0.001), (r * r) / (4 * focal)));
      }
      const dish = add(new THREE.LatheGeometry(profile, 64), mat.white, 0, dishVertexY, 0);
      dish.rotation.x = Math.PI; // abre hacia la Tierra

      const rimY = dishVertexY - depth;
      const rim = add(new THREE.TorusGeometry(dishR, 0.016, 8, 72), mat.frame, 0, rimY, 0);
      rim.rotation.x = Math.PI / 2;

      // Alimentador (bocina) en el foco sostenido por tres puntales
      const feedY = dishVertexY - focal;
      add(new THREE.CylinderGeometry(0.08, 0.035, 0.14, 24, 1, true), mat.frame, 0, feedY + 0.02, 0);
      add(new THREE.BoxGeometry(0.09, 0.09, 0.09), mat.dark, 0, feedY - 0.08, 0);
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
        strut(V(Math.cos(a) * dishR * 0.96, rimY, Math.sin(a) * dishR * 0.96), V(0, feedY - 0.06, 0), 0.012, mat.frame);
      }

      // Antenas de bocina piramidales
      [[0.44, -0.44], [-0.44, -0.44]].forEach(([x, z]) => {
        const horn = add(new THREE.CylinderGeometry(0.03, 0.1, 0.18, 4, 1, true), mat.frame, x, bottom - 0.09, z);
        horn.rotation.y = Math.PI / 4;
      });

      // --- Alas de paneles solares (giran sobre el eje X para seguir la luz) ---
      const panelW = 1.6;
      const panelH = 1.0;
      const panelGap = 0.06;
      const panelFaces = [mat.frame, mat.frame, mat.frame, mat.frame, mat.solar, mat.panelBack];
      satWings = [];

      for (const side of [1, -1]) {
        const wing = new THREE.Group();
        wing.position.set((side * W) / 2, 0.1, 0);
        root.add(wing);

        // Mecanismo de orientación (SADA) y botalón
        const drive = add(new THREE.CylinderGeometry(0.13, 0.13, 0.16, 28), mat.dark, side * 0.08, 0, 0, wing);
        drive.rotation.z = Math.PI / 2;
        strut(V(side * 0.16, 0, 0), V(side * 0.75, 0, 0), 0.03, mat.frame, wing);
        strut(V(side * 0.75, 0, 0), V(side * 1.0, 0.45, 0), 0.02, mat.frame, wing);
        strut(V(side * 0.75, 0, 0), V(side * 1.0, -0.45, 0), 0.02, mat.frame, wing);

        for (let i = 0; i < 3; i++) {
          const cx = side * (1.0 + panelW / 2 + i * (panelW + panelGap));
          add(new THREE.BoxGeometry(panelW, panelH, 0.035), panelFaces, cx, 0, 0, wing);
          if (i > 0) {
            const hx = side * (1.0 + i * (panelW + panelGap) - panelGap / 2);
            for (const hy of [-0.32, 0.32]) {
              add(new THREE.CylinderGeometry(0.022, 0.022, 0.14, 10), mat.dark, hx, hy, 0, wing);
            }
          }
        }

        wing.userData.tipX = side * (1.0 + 3 * panelW + 2 * panelGap + 0.05);
        satWings.push(wing);
      }

      // --- Luces de navegación (roja a babor, verde a estribor, estroboscópica blanca) ---
      satBlinkers = [];
      const addNavLight = (color, parent, x, y, z, phase, period) => {
        const bulb = add(new THREE.SphereGeometry(0.035, 12, 12), new THREE.MeshBasicMaterial({ color }), x, y, z, parent);
        const glow = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: tex.glowMap,
            color,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
          })
        );
        glow.scale.setScalar(0.55);
        bulb.add(glow);
        satBlinkers.push({ glow, phase, period });
      };
      addNavLight(0x34d399, satWings[0], satWings[0].userData.tipX, 0.5, 0, 0, 1.6);
      addNavLight(0xf87171, satWings[1], satWings[1].userData.tipX, 0.5, 0, 0.8, 1.6);
      addNavLight(0xffffff, root, 0.38, top + 0.56, -0.38, 0.3, 1.1);

      return root;
    }

    /**
     * Coloca el satélite en un punto fijo de una órbita baja inclinada (51.6°), apuntando al nadir
     */
    function createSatelliteSystem() {
      satOrbitGroup = new THREE.Group();
      satOrbitGroup.rotation.z = SAT_ORBIT_INCLINATION;
      scene.add(satOrbitGroup);

      satPivotGroup = new THREE.Group();
      satPivotGroup.rotation.y = state.satOrbitAngle;
      satOrbitGroup.add(satPivotGroup);

      satellite = buildSatelliteModel();
      satellite.position.set(SAT_ORBIT_RADIUS, 0, 0);
      satellite.rotation.z = -Math.PI / 2; // -Y local (antena) apunta hacia la Tierra
      satellite.scale.setScalar(SAT_SCALE);
      satPivotGroup.add(satellite);
    }

    /**
     * Orienta los paneles solares hacia la luz y hace parpadear las luces de navegación
     */
    function updateSatelliteDetails(delta, elapsed) {
      if (!satellite || !satellite.visible) return;

      satellite.getWorldQuaternion(satWorldQuatInv).invert();
      satLocalLight.copy(lightDirection).applyQuaternion(satWorldQuatInv);
      const targetAngle = Math.atan2(-satLocalLight.y, satLocalLight.z);
      const follow = 1 - Math.exp(-3.0 * delta);
      satWings.forEach((wing) => {
        const diff = Math.atan2(Math.sin(targetAngle - wing.rotation.x), Math.cos(targetAngle - wing.rotation.x));
        wing.rotation.x += diff * follow;
      });

      satBlinkers.forEach(({ glow, phase, period }) => {
        const t = (elapsed + phase) % period;
        glow.material.opacity = t < 0.12 ? 1.0 : 0.12;
      });
    }

    /**
     * Lleva la cámara al cuerpo seleccionado ("earth" | "moon" | "mars" | "satellite").
     * Con instant = true se coloca directamente (usado al iniciar).
     */
    function setCameraFocus(mode, instant = false) {
      state.cameraFocus = mode;

      const focusButtons = {
        earth: document.getElementById('focus-earth-btn'),
        moon: document.getElementById('focus-moon-btn'),
        mars: document.getElementById('focus-mars-btn'),
        satellite: document.getElementById('focus-satellite-btn')
      };

      // Plano cercano reducido solo al acercarse al satélite (evita recortar el modelo)
      camera.near = mode === 'satellite' ? 0.01 : 0.1;
      camera.updateProjectionMatrix();

      Object.entries(focusButtons).forEach(([key, btn]) => {
        if (!btn) return;
        const isMarsBtn = key === 'mars';
        if (key === mode) {
          btn.classList.remove('text-slate-400', 'border-transparent');
          if (isMarsBtn) {
            btn.classList.add('bg-orange-500/25', 'text-orange-200', 'border-orange-400/40');
          } else {
            btn.classList.add('bg-sky-500/25', 'text-sky-200', 'border-sky-400/40');
          }
        } else {
          btn.classList.remove(
            'bg-sky-500/25',
            'text-sky-200',
            'border-sky-400/40',
            'bg-orange-500/25',
            'text-orange-200',
            'border-orange-400/40'
          );
          btn.classList.add('text-slate-400', 'border-transparent');
        }
      });

      // Destino de la cámara y límites de zoom (sin alejarse lo suficiente para ver todo el sistema)
      const target = new THREE.Vector3();
      const camPos = new THREE.Vector3();
      let minDistance;
      let maxDistance;

      if (mode === 'earth') {
        target.set(0, 0, 0);
        camPos.set(0, 1.4, 6.2);
        minDistance = 2.6;
        maxDistance = 12.0;
      } else if (mode === 'moon') {
        moonMesh.getWorldPosition(target);
        const outwardDir = target.clone().normalize();
        const sideDir = new THREE.Vector3(-outwardDir.z, 0.35, outwardDir.x).normalize();
        camPos.copy(target).addScaledVector(sideDir, 2.3);
        minDistance = 1.05;
        maxDistance = 6.0;
      } else if (mode === 'mars') {
        marsTiltGroup.getWorldPosition(target);
        const outwardDir = target.clone().normalize();
        const sideDir = new THREE.Vector3(-outwardDir.z, 0.32, outwardDir.x).normalize();
        camPos.copy(target).addScaledVector(sideDir, 3.8);
        minDistance = 1.7;
        maxDistance = 10.0;
      } else if (mode === 'satellite') {
        satellite.getWorldPosition(target);
        // Vista desde fuera de la órbita, ligeramente por encima, con la Tierra de fondo
        const outwardDir = target.clone().normalize();
        const sideDir = new THREE.Vector3(-outwardDir.z, 0.0, outwardDir.x).normalize();
        camPos
          .copy(target)
          .addScaledVector(outwardDir, 0.55)
          .addScaledVector(sideDir, 0.45)
          .add(new THREE.Vector3(0, 0.22, 0));
        minDistance = 0.18;
        maxDistance = 3.0;
      }

      flight.minDistance = minDistance;
      flight.maxDistance = maxDistance;

      if (instant) {
        flight.active = false;
        camera.position.copy(camPos);
        controls.target.copy(target);
        controls.minDistance = minDistance;
        controls.maxDistance = maxDistance;
        return;
      }

      // Duración corta acotada (0.8–1.6 s) y arco proporcional a la distancia
      const travel = camera.position.distanceTo(camPos);
      flight.fromCam.copy(camera.position);
      flight.fromTarget.copy(controls.target);
      flight.toCam.copy(camPos);
      flight.toTarget.copy(target);
      flight.duration = THREE.MathUtils.clamp(
        FLIGHT_MIN_DURATION + travel * 0.035,
        FLIGHT_MIN_DURATION,
        FLIGHT_MAX_DURATION
      );
      flight.arc = Math.min(travel * 0.08, 1.5);
      flight.t = 0;
      flight.active = true;

      // Sin límites de zoom durante el vuelo para que OrbitControls no lo frene
      controls.minDistance = 0;
      controls.maxDistance = Infinity;
    }

    /**
     * Avanza el vuelo de cámara con aceleración y frenado suaves (smootherstep),
     * empujando la cámara fuera de cualquier planeta que se cruce en el camino
     */
    function updateFlight(delta) {
      if (!flight.active) return;

      flight.t = Math.min(1, flight.t + delta / flight.duration);
      const t = flight.t;
      const eased = t * t * t * (t * (t * 6 - 15) + 10);

      controls.target.lerpVectors(flight.fromTarget, flight.toTarget, eased);
      camera.position.lerpVectors(flight.fromCam, flight.toCam, eased);
      camera.position.y += Math.sin(Math.PI * eased) * flight.arc;

      flightObstacles.forEach(({ object, safeRadius }) => {
        object.getWorldPosition(obstacleCenter);
        obstacleOffset.subVectors(camera.position, obstacleCenter);
        if (obstacleOffset.length() < safeRadius) {
          camera.position.copy(obstacleCenter).add(obstacleOffset.setLength(safeRadius));
        }
      });

      if (t >= 1) {
        flight.active = false;
        controls.minDistance = flight.minDistance;
        controls.maxDistance = flight.maxDistance;
      }
    }

    /**
     * Configura todos los controles interactivos
     */
    function setupUIEvents() {
      // Mostrar / ocultar panel
      const togglePanelBtn = document.getElementById('toggle-panel-btn');
      const controlPanel = document.getElementById('control-panel');

      togglePanelBtn.addEventListener('click', () => {
        state.isPanelOpen = !state.isPanelOpen;
        if (state.isPanelOpen) {
          controlPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
        } else {
          controlPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        }
      });

      // Selector de enfoque de cámara
      document.getElementById('focus-earth-btn').addEventListener('click', () => setCameraFocus('earth'));
      document.getElementById('focus-moon-btn').addEventListener('click', () => setCameraFocus('moon'));
      document.getElementById('focus-mars-btn').addEventListener('click', () => setCameraFocus('mars'));
      document.getElementById('focus-satellite-btn').addEventListener('click', () => setCameraFocus('satellite'));

      // Centrar vista
      document.getElementById('reset-camera-btn').addEventListener('click', () => {
        setCameraFocus(state.cameraFocus);
      });

      // Pausar / Reanudar
      const toggleRotationBtn = document.getElementById('toggle-rotation-btn');
      const pauseIcon = document.getElementById('pause-icon');
      const playIcon = document.getElementById('play-icon');
      const rotationBtnLabel = document.getElementById('rotation-btn-label');

      toggleRotationBtn.addEventListener('click', () => {
        state.isRotating = !state.isRotating;
        if (state.isRotating) {
          pauseIcon.classList.remove('hidden');
          playIcon.classList.add('hidden');
          rotationBtnLabel.textContent = 'Pausar';
        } else {
          pauseIcon.classList.add('hidden');
          playIcon.classList.remove('hidden');
          rotationBtnLabel.textContent = 'Reanudar';
        }
      });

      // Deslizador de velocidad orbital / rotación
      const speedSlider = document.getElementById('speed-slider');
      const speedValue = document.getElementById('speed-value');
      speedSlider.addEventListener('input', (e) => {
        state.rotationSpeed = parseFloat(e.target.value);
        speedValue.textContent = `${state.rotationSpeed.toFixed(1)}x`;
      });

      // Interruptor Nubes
      const toggleCloudsBtn = document.getElementById('toggle-clouds-btn');
      const cloudsStatus = document.getElementById('clouds-status');
      toggleCloudsBtn.addEventListener('click', () => {
        state.showClouds = !state.showClouds;
        if (cloudsMesh) cloudsMesh.visible = state.showClouds;
        updateTogglePillStyle(toggleCloudsBtn, cloudsStatus, state.showClouds);
      });

      // Interruptor Atmósfera
      const toggleAtmosphereBtn = document.getElementById('toggle-atmosphere-btn');
      const atmosphereStatus = document.getElementById('atmosphere-status');
      toggleAtmosphereBtn.addEventListener('click', () => {
        state.showAtmosphere = !state.showAtmosphere;
        if (atmosphereMesh) atmosphereMesh.visible = state.showAtmosphere;
        if (marsAtmosphereMesh) marsAtmosphereMesh.visible = state.showAtmosphere;
        updateTogglePillStyle(toggleAtmosphereBtn, atmosphereStatus, state.showAtmosphere);
      });
    }

    /**
     * Actualiza el aspecto visual de los botones interruptores
     */
    function updateTogglePillStyle(buttonEl, dotEl, isActive, accent = 'sky') {
      const isOrange = accent === 'orange';
      if (isActive) {
        buttonEl.classList.remove('border-white/10', 'bg-white/5', 'text-slate-400');
        if (isOrange) {
          buttonEl.classList.add('border-orange-400/40', 'bg-orange-500/20', 'text-white');
          dotEl.classList.remove('bg-slate-600');
          dotEl.classList.add('bg-orange-400', 'shadow-[0_0_8px_#fb923c]');
        } else {
          buttonEl.classList.add('border-sky-400/40', 'bg-sky-500/20', 'text-white');
          dotEl.classList.remove('bg-slate-600');
          dotEl.classList.add('bg-sky-400', 'shadow-[0_0_8px_#38bdf8]');
        }
      } else {
        buttonEl.classList.remove(
          'border-sky-400/40',
          'bg-sky-500/20',
          'border-orange-400/40',
          'bg-orange-500/20',
          'text-white'
        );
        buttonEl.classList.add('border-white/10', 'bg-white/5', 'text-slate-400');
        dotEl.classList.remove(
          'bg-sky-400',
          'shadow-[0_0_8px_#38bdf8]',
          'bg-orange-400',
          'shadow-[0_0_8px_#fb923c]'
        );
        dotEl.classList.add('bg-slate-600');
      }
    }

    /**
     * Adapta la escena al redimensionar la ventana
     */
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    /**
     * Bucle principal de animación
     */
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      // Solo rotación sobre su propio eje (los cuerpos no se trasladan)
      if (state.isRotating && earthMesh && cloudsMesh && moonMesh && marsMesh) {
        const baseAngularVelocity = 0.16 * state.rotationSpeed;
        // Tierra, Luna y Marte giran a la misma velocidad
        const spin = baseAngularVelocity * delta;
        earthMesh.rotation.y += spin;
        moonMesh.rotation.y += spin;
        marsMesh.rotation.y += spin;
        // Las nubes se desplazan un poco más rápido que la superficie para que se note su movimiento
        cloudsMesh.rotation.y += spin * 1.35;
      }

      updateFlight(delta);

      if (starField) {
        starField.rotation.y += 0.0018 * delta;
      }

      controls.update();
      updateHeadlight();
      updateSatelliteDetails(delta, clock.elapsedTime);

      renderer.render(scene, camera);
    }

    // Iniciar simulación cuando el DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        init();
        animate();
      });
    } else {
      init();
      animate();
    }
  </script>
</body>
